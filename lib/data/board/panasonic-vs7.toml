[board]
vendor = "Panasonic"
model = "VS7"
platform = "apoxi"
cpu.type = "pmb8875"
cpu.rev = 0x05
aliases = ["panasonic-vs3", "panasonic-mx3", "panasonic-mx7", "panasonic-sa3", "panasonic-sa7"]
patterns = [
	{ offset = 0x20C20, pattern = '"NBG_LEOPARD_"' },
]

[peripheral.SIM_SLOT]
type = "iso7816-slot"
bus = "SIM"
in = { RST = "SIM:CC_RST" }

[peripheral.FLASH0]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 0
flash = { vid = 0x0089, pid = 0x880D }

[peripheral.FLASH1]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 2
flash = { vid = 0x0089, pid = 0x881C }

[peripheral.SDRAM]
type = "sdram"
bus = "EBU"
ebu.cs = 1
ram.size = 0x1000000 # 16 Mb

[peripheral.PMIC]
type = "pmb6812"
bus = "I2C"
addr = 0x08

# Unverified: no schematic yet, so the AFE outputs drive speakers directly.
[peripheral.AFE_EP_SPEAKER]
type = "speaker"
port = { in = "DSP:AFE_EP" }

[peripheral.AFE_EPPA_SPEAKER]
type = "speaker"
port = { in = "DSP:AFE_EPPA" }

[peripheral.GIMMICK]
type = "s1d13732"
bus = "DIF"
in.ssi-gpio-cs = "DIF_CS"
in.SA0 = "DIF_RS"
in.RESET = "AP_RST"

[analog]
M_0 = { type = "resistor", value = 9300 }
M_1 = { type = "resistor_divider", r1 = 330000, r2 = 220000, value = 3700 }
M_7 = { type = "resistor", value = 14800 }
M_9 = { type = "resistor", value = 15000 }

[dsp]
rom_version = 0x0604

[gpio.pull-resistors]
I2C_SCL = 1
I2C_SDA = 1

[gpio.aliases]
DSPIN1 = "DIF_MRST"
DIF_DAT = "DIF_MTSR"
DIF_RESET = "AP_RST"
T_OUT1 = "DISP_IRQ"
T_OUT8 = "LCD_SCS"
RSTOUT_N = "DISP_IRQ"

[peripheral.END_KEY]
type = "key-switch"
key = "END_CALL"
level = 1
out = { out = "PMIC:ON" }

[peripheral.KEYPAD_MATRIX]
type = "key-matrix"
in = { in0 = "KP_OUT0", in1 = "KP_OUT1", in2 = "KP_OUT2", in3 = "KP_OUT3", in5 = "KP_IN6", in6 = "KP_IN5", in7 = "KP_IN4" }
out = { out0 = "KP_IN0", out1 = "KP_IN1", out2 = "KP_IN2", out3 = "KP_IN3", out4 = "SSC2_SCLK" }
# keys.NAME = [out, in]
keys.SOFT_LEFT		= [3, 5]
keys.SOFT_RIGHT		= [2, 6]

keys.NAV_UP			= [2, 5]
keys.NAV_RIGHT		= [1, 6]
keys.NAV_CENTER		= [0, 3]
keys.NAV_LEFT		= [3, 3]
keys.NAV_DOWN		= [0, 7]

keys.SEND			= [1, 3]
keys.END_CALL		= [4, 6]

keys.NUM1			= [3, 0]
keys.NUM2			= [3, 1]
keys.NUM3			= [3, 2]

keys.NUM4			= [2, 0]
keys.NUM5			= [2, 1]
keys.NUM6			= [2, 2]

keys.NUM7			= [1, 0]
keys.NUM8			= [1, 1]
keys.NUM9			= [1, 2]

keys.STAR			= [0, 0]
keys.NUM0			= [0, 1]
keys.HASH			= [0, 2]

keys.VOLUME_UP		= [0, 6]
keys.VOLUME_DOWN	= [2, 3]
keys.CAMERA			= [0, 5]

[startup.ONLINE]
duration = 5
keys = ["END_CALL"]

[startup.PTEST]
duration = 5
keys = ["STAR", "HASH", "END_CALL"]

[startup.OFFLINE]
keys = []
