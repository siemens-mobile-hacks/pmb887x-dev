[board]
vendor = "BenQ-Siemens"
model = "S68"
extends = "include/siemens-sg2-elka.toml"

[peripheral.LCD0]
type = "l2f50333t"
bus = "DIF"
width = 132
height = 176
bgr_filter = true
rotation = 180
in = { ssi-gpio-cs = "DIF_CS1", CD = "DIF_CD", WR = "DIF_WR", RD = "DIF_RD", RESET = "DIF_RESET1" }

[peripheral.PMIC]
type = "d1094xx"
port = { I2C = "I2C", I2S_RX = "DSP:I2S2_TX", I2S_TX = "DSP:I2S2_RX", LINE = "DSP:AFE_EPPA" }
addr = 0x31
revision = 0xED

[peripheral.LOUDSPEAKER]
type = "speaker"
port = { in = "PMIC:MONO" }
gain = -700

[peripheral.RECEIVER]
type = "speaker"
port = { in = "DSP:AFE_EP" }

[peripheral.RF]
type = "hd155165bp"
port = { RFSSC = "TPU:RFSSC0", IQ_TX = "DSP:IQ_RX" }

[gpio.inputs]
# HWID 404
HW_DET_MOB_TYPE1=0
HW_DET_MOB_TYPE2=0
HW_DET_MOB_TYPE3=1
HW_DET_MOB_TYPE4=0
HW_DET_BLUETOOTH=0
HW_DET_BAND_SEL=0
