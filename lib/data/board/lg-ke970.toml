[board]
vendor = "LG"
model = "KE970"
cpu.type = "pmb8876"
# cpu.rev = 0x10 # newer units may have 0x11, LG firmware supports both even in V10a
cpu.rev = 0x11
cpu.uid0 = 0x03157463
cpu.uid1 = 0x18000283
cpu.uid2 = 0x00090D0C

[peripheral.LCD0]
type = "r61505"
bus = "DIF"
width = 240
height = 320
rotation = 0
bgr_filter = true
in = { CS = "DIF_CS1", CD = "DIF_CD", WR = "DIF_WR", RESET = "DIF_RESET1" }

[peripheral.SIM_CARD]
type = "sim-card"
bus = "SIM"
in = { RST = "SIM:CC_RST" }

[peripheral.FLASH0]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 0
flash = { vid = 0x0089, pid = 0x88B0, size = 0x4000000 }

[peripheral.FLASH1]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 2
flash = { vid = 0x0089, pid = 0x88B0, size = 0x4000000 }

[peripheral.SDRAM]
type = "sdram"
bus = "EBU"
ebu.cs = 1
ram.size = 0x2000000 # 32 MiB

[peripheral.PMIC]
type = "pmb6812"
bus = "I2C"
addr = 0x08

[peripheral.RF]
type = "pmb6272"
bus = "TPU:RFSSC"

[peripheral.AMP]
type = "lm4946"
bus = "I2C"
addr = 0x7D


[analog]
# M0  BATT_TEMP Battery temperature measure
# M1  RF_TEMP RF block temperature measure
# M2  JACK_TYPE Accessory type detect
# M7  H/W VERSION S-Gold2 H/W version detect
# M8  VSUPPLY Battery supply voltage measure
# M9  I_MONITOR Current consumption measure
# M10 REMOTE_ADC Remote control key detect
M_0 = { type = "resistor", value = 9300 }
M_7 = { type = "resistor", value = 14800 }
M_8 = { type = "resistor_divider", r1 = 390000, r2 = 100000, value = 4200 }
M_9 = { type = "resistor", value = 15000 }

[dsp]
ram0_value = 0x0801

[gpio.aliases]
DIF_HD = "USB_CHG_EN"
T_OUT9 = "LCD_BACKLIGHT"
I2S2_WA1 = "SLIDE_KEY_BACKLIGHT"
DSPOUT0 = "SCROLL_KEY_A"
DSPOUT1 = "SCROLL_KEY_B"
DSPIN0 = "BT_RESET"
DSPIN1 = "SIM_EN"
PIN110 = "RPWRON" # remote poweron
PIN111 = "SPK_RCV_SEL"
DIF_CS2 = "LCD_IF_MODE"
DIF_RD = "HOOK_DETECT"
USART1_RTS = "HSO_SEL"
USART1_CTS = "AUDIO_AMP_EN"
T_OUT12 = "AF_PWR_EN"
T_OUT8 = "JACK_DETECT"
CLKOUT0 = "SLIDE_OPEN"
PIN109 = "SCROLL_EN"

[gpio.inputs]
RPWRON = 1 # remote power on (skips power button hold requirement)
SLIDE_OPEN = 1
SCROLL_EN = 1
JACK_DETECT = 1 # high = no headphones connected

[keyboard]
# [KP_IN, KP_OUT, ..., KP_OUT]
SOFT_LEFT	= [0, 0]	# MENU
NAV_CENTER	= [0, 1]	# OK
SOFT_RIGHT	= [0, 2]	# SERCH
NAV_LEFT	= [5, 0]	# LEFT
NAV_RIGHT	= [5, 2]	# RIGHT

SEND		= [0, 3]	# KB_SND
CLEAR		= [1, 3]	# KB_CLR
END_CALL	= [5, 1]	# END

NUM1		= [1, 0]
NUM2		= [1, 1]
NUM3		= [1, 2]
NUM4		= [2, 0]
NUM5		= [2, 1]
NUM6		= [2, 2]
NUM7		= [3, 0]
NUM8		= [3, 1]
NUM9		= [3, 2]
STAR		= [4, 0]	# KB_STAR
NUM0		= [4, 1]	# 510
HASH		= [4, 2]	# KB_SHA

MUSIC		= [4, 3]	# KB_BGM
PTT         = [5, 3]    # shutter
CAMERA		= [5, 4]	# KB_CAM (side / shutter)
VOLUME_UP	= [2, 3]	# KB_UP
VOLUME_DOWN	= [3, 3]	# KB_DOWN

[keyboard.gpio]
END_CALL = [{ target = "PMIC:ON" }]
# NAV_UP = [{ target = "SCROLL_KEY_A" }]
# NAV_DOWN = [{ target = "SCROLL_KEY_B" }]

[startup.ONLINE]
duration = 5
keys = ["END_CALL"]

[startup.PTEST]
duration = 5
keys = ["STAR", "END_CALL"] # unusually, LG phones don't care about HASH

[startup.OFFLINE]
keys = []
