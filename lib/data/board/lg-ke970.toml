[board]
vendor = "LG"
model = "KE970"
platform = "apoxi"
cpu.type = "pmb8876"
# cpu.rev = 0x10 # newer units may have 0x11, LG firmware supports both even in V10a
cpu.rev = 0x11
cpu.uid0 = 0x03157463
cpu.uid1 = 0x18000283
cpu.uid2 = 0x00090D0C
patterns = [
	{ offset = 0x40C00, pattern = '"DWD_DRIVER_SON80_"' },
	{ pattern = '"+DDLI:\"KE970\""' },
]

[rtc]
format = "calendar"

[peripheral.LCD0]
type = "r61505"
bus = "DIF"
width = 240
height = 320
rotation = 0
bgr_filter = true
in = { ssi-gpio-cs = "DIF_CS1", CD = "DIF_CD", WR = "DIF_WR", RESET = "DIF_RESET1" }

[peripheral.SIM_SLOT]
type = "iso7816-slot"
bus = "SIM"
in = { RST = "SIM:CC_RST" }

# PF38F6070M0Y0BE: CE# = CS0 AND CS2, A25 = CS0 (service manual, p. 117).
[peripheral.FLASH0]
type = "cfi-flash"
bus = "EBU"
flash = { vid = 0x0089, pid = 0x88B0 }
ebu.windows = [
	{ cs = 0, offset = 0x0000000, size = 0x4000000 },
	{ cs = 2, offset = 0x4000000, size = 0x4000000 },
]

[peripheral.SDRAM]
type = "sdram"
bus = "EBU"
ebu.cs = 1
ram.size = 0x2000000 # 32 MiB

[peripheral.PMIC]
type = "pmb6812"
bus = "I2C"
addr = 0x08

[peripheral.SD_SLOT]
type = "sd-slot"
port = { card = "MCI:CARD" }

[peripheral.SPEAKER_SWITCH]
type = "audio-switch"
port = { in0 = "DSP:AFE_EP", in1 = "AMP:SPEAKER" }
in = { select = "SPK_RCV_SEL" }

[peripheral.HEADSET_SWITCH]
type = "audio-switch"
port = { in0 = "AMP:HEADPHONE" }
in = { select = "HSO_SEL" }

[peripheral.SPEAKER]
type = "speaker"
port = { in = "SPEAKER_SWITCH:out" }

[peripheral.HEADSET]
type = "speaker"

[peripheral.IO_CONNECTOR]
type = "accessory-connector"
default = "none"
unplugged = "none"
accessories = {
	none = {
		gpio = { JACK_DETECT = 1 },
	},
	headset-stereo = {
		gpio = { JACK_DETECT = 0 },
		port = { "HEADSET:in" = "HEADSET_SWITCH:out" },
	},
	data-cable = {
		gpio = { JACK_DETECT = 1, USART0_CTS = 0 },
	},
}

[peripheral.RF]
type = "pmb6272"
port = { RFSSC = "TPU:RFSSC0", IQ_TX = "DSP:IQ_RX" }

[peripheral.AMP]
type = "lm4946"
bus = "I2C"
addr = 0x7D
port = { LINE_IN = "DSP:AFE_EPPA" }

[peripheral.SCROLL]
# Hall-effect scroll dial: two EM-0611 switches (U601, U602 on the LCD FPCB, fed from V_SCROLL_2.8) under a magnetised wheel, 90 degrees out of phase
# SCROLL_KEY_A: rising edges captured by CAPCOM1 CC6
# SCROLL_KEY_B: read as a level
type = "rotary-encoder"
out = { A = "SCROLL_KEY_A", B = "SCROLL_KEY_B" }
steps = 4

[analog]
# M0  BATT_TEMP Battery temperature measure
# M1  RF_TEMP RF block temperature measure
# M2  JACK_TYPE Accessory type detect
# M7  H/W VERSION S-Gold2 H/W version detect
# M8  VSUPPLY Battery supply voltage measure
# M9  I_MONITOR Current consumption measure / 47 mOhn * 0.01 A/A * 2.2 kOhm ~= 1.03 mV/mA
# M10 REMOTE_ADC Remote control key detect
# M0 = the higher it goes the lower temp is reported, fw caps at -30C
# 500 - tbat_adc says 999 -> fw report 42C
# 683 - tbat_adc says 1364 -> fw report 22C
M_0 = { type = "voltage", value = 683 }
M_7 = { type = "resistor", value = 14800 }
M_8 = { type = "resistor_divider", r1 = 390000, r2 = 100000, value = 4200 }
M_9 = { type = "voltage", value = 1500 } # ~150mV draw

[dsp]
rom_version = 0x0801

[gpio.pull-resistors]
I2C_SCL = 1
I2C_SDA = 1

[gpio.aliases]
MMCI_DAT1 = "USB_CHG_EN"
T_OUT7 = "KP_OUT4"
T_OUT9 = "LCD_BACKLIGHT"
I2S2_RX = "SCROLL_EN"
I2S2_TX = "HALL_EN"
I2S2_WA1 = "SLIDE_KEY_BACKLIGHT"
DSPOUT0 = "SCROLL_KEY_A"
DSPOUT1 = "SCROLL_KEY_B"
DSPIN0 = "BT_RESET"
DSPIN1 = "SIM_EN"
IRDA_TX = "RPWRON" # remote poweron
IRDA_RX = "SPK_RCV_SEL"
DIF_CS2 = "LCD_IF_MODE"
DIF_RD = "HOOK_DETECT"
USART1_RTS = "HSO_SEL"
USART1_CTS = "AUDIO_AMP_EN"
T_OUT12 = "AF_PWR_EN"
T_OUT8 = "JACK_DETECT"
CLKOUT0 = "SLIDE_OPEN"
USIF_SCLK = "USB_EOC"

[gpio.inputs]
RPWRON = 1 # remote power on (skips power button hold requirement)
SLIDE_OPEN = 1

[peripheral.END_KEY]
type = "key-switch"
key = "END_CALL"
level = 1
out = { out = "PMIC:ON" }

[peripheral.SCROLL_CW_KEY]
type = "key-switch"
key = "NAV_UP"
level = 1
out = { out = "SCROLL:CW" }

[peripheral.SCROLL_CCW_KEY]
type = "key-switch"
key = "NAV_DOWN"
level = 1
out = { out = "SCROLL:CCW" }

[peripheral.KEYPAD_MATRIX]
type = "key-matrix"
in = { in0 = "KP_OUT0", in1 = "KP_OUT1", in2 = "KP_OUT2", in3 = "KP_OUT3", in4 = "KP_OUT4" }
out = { out0 = "KP_IN0", out1 = "KP_IN1", out2 = "KP_IN2", out3 = "KP_IN3", out4 = "KP_IN4", out5 = "KP_IN5" }
# keys.NAME = [out, in]
keys.SOFT_LEFT		= [0, 0]	# MENU
keys.NAV_CENTER		= [0, 1]	# OK
keys.SOFT_RIGHT		= [0, 2]	# SERCH
keys.NAV_LEFT		= [5, 0]	# LEFT
keys.NAV_RIGHT		= [5, 2]	# RIGHT

keys.SEND			= [0, 3]	# KB_SND
keys.CLEAR			= [1, 3]	# KB_CLR
keys.END_CALL		= [5, 1]	# END

keys.NUM1			= [1, 0]
keys.NUM2			= [1, 1]
keys.NUM3			= [1, 2]
keys.NUM4			= [2, 0]
keys.NUM5			= [2, 1]
keys.NUM6			= [2, 2]
keys.NUM7			= [3, 0]
keys.NUM8			= [3, 1]
keys.NUM9			= [3, 2]
keys.STAR			= [4, 0]	# KB_STAR
keys.NUM0			= [4, 1]	# 510
keys.HASH			= [4, 2]	# KB_SHA

keys.MUSIC			= [4, 3]	# KB_BGM
keys.PTT			= [5, 3]	# KB_CAM AF (half press)
keys.CAMERA			= [5, 4]	# KB_CAM SHUTTER
keys.VOLUME_UP		= [2, 3]	# KB_UP
keys.VOLUME_DOWN	= [3, 3]	# KB_DOWN


[startup.ONLINE]
duration = 5
keys = ["END_CALL"]

[startup.PTEST]
duration = 5
keys = ["STAR", "END_CALL"] # unusually, LG phones don't care about HASH

[startup.OFFLINE]
keys = []
