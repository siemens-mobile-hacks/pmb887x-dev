[board]
vendor = "Siemens"
model = "SK65 RU"
extends = "siemens-sk65.toml"

# Russian keycaps: the bottom row is Z X C V B N M ? , <-, Fn and . move to the space row, - replaces <-
[peripheral.KEYPAD_MATRIX]
keys.QWERTY_MINUS		= [5, 4]
keys.QWERTY_Z			= [2, 2]
keys.QWERTY_X			= [2, 0]
keys.QWERTY_C			= [3, 0]
keys.QWERTY_V			= [2, 1]
keys.QWERTY_B			= [3, 1]
keys.QWERTY_N			= [3, 2]
keys.QWERTY_M			= [2, 3]
keys.QWERTY_QUESTION	= [3, 3]
keys.QWERTY_COMMA		= [2, 4]
keys.QWERTY_BACKSPACE	= [3, 4]
keys.QWERTY_BLUE		= [1, 3]
keys.QWERTY_DOT			= [0, 4]
keys.QWERTY_SHIFT_RIGHT	= [0, 0]
