[board]
vendor = "BenQ-Siemens"
model = "CL61"
extends = "include/siemens-sg2-elka.toml"

[peripheral.LCD0]
type = "jbt6k71"
bus = "DIF"
width = 240
height = 320
rotation = 180
in = { ssi-gpio-cs = "DIF_CS1", CD = "DIF_CD", WR = "DIF_WR", RD = "DIF_RD", RESET = "DIF_RESET1" }

# No schematic: the wiring follows the firmware audio route script, which matches EL71.
[peripheral.PMIC]
type = "d1094xx"
port = { I2C = "I2C", I2S_RX = "DSP:I2S2_TX", I2S_TX = "DSP:I2S2_RX", LINE = "DSP:AFE_EPPA" }
addr = 0x31
revision = 0xAA

[peripheral.LOUDSPEAKER]
type = "speaker"
port = { in = "PMIC:MONO" }
gain = 300

[peripheral.HEADSET]
type = "speaker"
gain = 2250

[peripheral.RECEIVER]
type = "speaker"
port = { in = "DSP:AFE_EP" }

[gpio.inputs]
# HWID 407
HW_DET_MOB_TYPE1=1
HW_DET_MOB_TYPE2=1
HW_DET_MOB_TYPE3=1
HW_DET_MOB_TYPE4=0
HW_DET_BLUETOOTH=0
HW_DET_BAND_SEL=0
