[board]
vendor = "LG"
model = "KE800"
platform = "apoxi"

cpu.type = "pmb8876"
cpu.rev = 0x10

[rtc]
format = "calendar"

[peripheral.LCD0]
type = "r63400"
bus = "DIF"
width = 240
height = 320
rotation = 0
in = { ssi-gpio-cs = "DIF_CS1", CD = "DIF_CD", WR = "DIF_WR", RESET = "DIF_RESET1" }

[peripheral.SIM_SLOT]
type = "iso7816-slot"
bus = "SIM"
in = { RST = "SIM:CC_RST" }

[peripheral.FLASH0]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 0
flash = { vid = 0x0089, pid = 0x88B0, size = 0x4000000 }

[peripheral.FLASH1]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 2
flash = { vid = 0x0089, pid = 0x88B0, size = 0x4000000 }

[peripheral.SDRAM]
type = "sdram"
bus = "EBU"
ebu.cs = 1
ram.size = 0x2000000 # 32 MiB

[peripheral.PMIC]
type = "pmb6812"
bus = "I2C"
addr = 0x08

[peripheral.RECEIVER]
type = "speaker"
port = { in = "DSP:AFE_EP" }

[peripheral.LOUDSPEAKER]
type = "speaker"
port = { in = "AMP:SPEAKER" }

[peripheral.HEADSET]
type = "speaker"
port = { in = "AMP:HEADPHONE" }

[peripheral.RF]
type = "pmb6272"
port = { RFSSC = "TPU:RFSSC0", IQ_TX = "DSP:IQ_RX" }

# LIN/RIN come from the FM/EPPA multiplexer, which is not modeled: they take EPPA.
[peripheral.AMP]
type = "lm4946"
bus = "I2C"
addr = 0x7D
port = { PHONE_IN = "DSP:AFE_EPPA", LINE_IN = "DSP:AFE_EPPA" }


[analog]
# M0  BATT_TEMP Battery temperature measure
# M1  RF_TEMP RF block temperature measure
# M2  JACK_TYPE Accessory type detect
# M7  H/W VERSION S-Gold2 H/W version detect
# M8  VSUPPLY Battery supply voltage measure
# M9  I_MONITOR Current consumption measure
# M10 REMOTE_ADC Remote control key detect
M_0 = { type = "resistor", value = 9300 }
M_7 = { type = "resistor", value = 14800 }
M_8 = { type = "resistor_divider", r1 = 330000, r2 = 220000, value = 3700 }
M_9 = { type = "resistor", value = 15000 }

[dsp]
rom_version = 0x0801

[gpio.aliases]
PIN110 = "RPWRON" # remote poweron
PIN111 = "SPK_RCV_SEL"
T_OUT8 = "JACK_DETECT"
CLKOUT0 = "SLIDE_OPEN"
USIF_SCLK = "SCROLL_EN"

[gpio.inputs]
RPWRON = 1 # remote power on (skips power button hold requirement)
SLIDE_OPEN = 1
SCROLL_EN = 1
JACK_DETECT = 1 # high = no headphones connected

[keyboard]
# [KP_IN, KP_OUT, ..., KP_OUT]
SOFT_LEFT	= [4, 3]
NAV_CENTER	= [0, 4]
SOFT_RIGHT	= [3, 3]
NAV_UP		= [2, 4]
NAV_RIGHT	= [3, 4]
NAV_LEFT	= [4, 4]
NAV_DOWN	= [1, 4]

SEND		= [1, 3]	# KB_SND
CLEAR		= [2, 3]	# KB_CLR
END_CALL	= [5, 1]	# END

NUM1		= [1, 0]
NUM2		= [1, 1]
NUM3		= [1, 2]
NUM4		= [2, 0]
NUM5		= [2, 1]
NUM6		= [2, 2]
NUM7		= [3, 0]
NUM8		= [3, 1]
NUM9		= [3, 2]
STAR		= [4, 0]	# KB_STAR
NUM0		= [4, 1]	# 510
HASH		= [4, 2]	# KB_SHA

MUSIC		= [0, 3]	# KB_BGM
CAMERA		= [0, 2]	# KB_CAM (side / shutter)
VOLUME_UP	= [0, 0]	# KB_UP
VOLUME_DOWN	= [0, 1]	# KB_DOWN

[keyboard.gpio]
END_CALL = [{ target = "PMIC:ON" }]

[startup.ONLINE]
duration = 5
keys = ["END_CALL"]

[startup.PTEST]
duration = 5
keys = ["STAR", "HASH", "END_CALL"]

[startup.OFFLINE]
keys = []
