[board]
vendor = "LG"
model = "KE800"
platform = "apoxi"

cpu.type = "pmb8876"
cpu.rev = 0x10
patterns = [
	{ offset = 0x40C00, pattern = '"DWD_DRIVER_SON80_"' },
	{ pattern = '"+DDLI:\"KE800\""' },
]

[rtc]
format = "calendar"

[peripheral.LCD0]
type = "r63400"
bus = "DIF"
width = 240
height = 320
rotation = 0
in = { ssi-gpio-cs = "DIF_CS1", CD = "DIF_CD", WR = "DIF_WR", RESET = "DIF_RESET1" }

[peripheral.SIM_SLOT]
type = "iso7816-slot"
bus = "SIM"
in = { RST = "SIM:CC_RST" }

# PF38F6070M0Y0BE: CE# = CS0 AND CS2, A25 = CS0 (service manual, p. 85).
[peripheral.FLASH0]
type = "cfi-flash"
bus = "EBU"
flash = { vid = 0x0089, pid = 0x88B0 }
ebu.windows = [
	{ cs = 0, offset = 0x0000000, size = 0x4000000 },
	{ cs = 2, offset = 0x4000000, size = 0x4000000 },
]

[peripheral.SDRAM]
type = "sdram"
bus = "EBU"
ebu.cs = 1
ram.size = 0x2000000 # 32 MiB

[peripheral.PMIC]
type = "pmb6812"
bus = "I2C"
addr = 0x08

[peripheral.SD_SLOT]
type = "sd-slot"
port = { card = "MCI:CARD" }

[peripheral.RECEIVER]
type = "speaker"
port = { in = "DSP:AFE_EP" }

[peripheral.LOUDSPEAKER]
type = "speaker"
port = { in = "AMP:SPEAKER" }

[peripheral.HEADSET_SWITCH]
type = "audio-switch"
port = { in0 = "AMP:HEADPHONE" }
in = { select = "HSO_SEL" }

[peripheral.HEADSET]
type = "speaker"

[peripheral.IO_CONNECTOR]
type = "accessory-connector"
default = "data-cable"
unplugged = "none"
accessories = {
	none = {
		gpio = { JACK_DETECT = 1, CTS_0 = 1 },
	},
	data-cable = {
		gpio = { JACK_DETECT = 1, CTS_0 = 0 },
	},
	headset-stereo = {
		gpio = { JACK_DETECT = 0, CTS_0 = 1 },
		port = { "HEADSET:in" = "HEADSET_SWITCH:out" },
	},
}

[peripheral.RF]
type = "pmb6272"
port = { RFSSC = "TPU:RFSSC0", IQ_TX = "DSP:IQ_RX" }

# LIN/RIN come from the FM/EPPA multiplexer, which is not modeled: they take EPPA.
[peripheral.AMP]
type = "lm4946"
bus = "I2C"
addr = 0x7C
port = { PHONE_IN = "DSP:AFE_EPPA", LINE_IN = "DSP:AFE_EPPA" }


[analog]
# M0  BATT_TEMP Battery temperature measure
# M1  RF_TEMP RF block temperature measure
# M2  JACK_TYPE Accessory type detect
# M7  H/W VERSION S-Gold2 H/W version detect
# M8  VSUPPLY Battery supply voltage measure
# M9  I_MONITOR Current consumption measure
# M10 REMOTE_ADC Remote control key detect
M_0 = { type = "resistor", value = 9300 }
M_7 = { type = "resistor", value = 14800 }
M_8 = { type = "resistor_divider", r1 = 330000, r2 = 220000, value = 3700 }
M_9 = { type = "resistor", value = 15000 }

[dsp]
rom_version = 0x0801

[gpio.pull-resistors]
I2C_SCL = 1
I2C_SDA = 1

[gpio.aliases]
IRDA_TX = "RPWRON" # remote poweron
IRDA_RX = "SPK_RCV_SEL"
T_OUT8 = "JACK_DETECT"
USART0_CTS = "CTS_0"
USART0_RTS = "RTS_0"
DIF_VD = "HSO_SEL"
CLKOUT0 = "SLIDE_OPEN"
USIF_SCLK = "SCROLL_EN"

[gpio.inputs]
RPWRON = 1 # remote power on (skips power button hold requirement)
SLIDE_OPEN = 1
SCROLL_EN = 1

[peripheral.END_KEY]
type = "key-switch"
key = "END_CALL"
level = 1
out = { out = "PMIC:ON" }

[peripheral.KEYPAD_MATRIX]
type = "key-matrix"
in = { in0 = "KP_OUT0", in1 = "KP_OUT1", in2 = "KP_OUT2", in3 = "KP_OUT3", in4 = "T_OUT7" }
out = { out0 = "KP_IN0", out1 = "KP_IN1", out2 = "KP_IN2", out3 = "KP_IN3", out4 = "KP_IN4", out5 = "KP_IN5" }
# keys.NAME = [out, in]
keys.SOFT_LEFT		= [4, 3]
keys.NAV_CENTER		= [0, 4]
keys.SOFT_RIGHT		= [3, 3]
keys.NAV_UP			= [2, 4]
keys.NAV_RIGHT		= [3, 4]
keys.NAV_LEFT		= [4, 4]
keys.NAV_DOWN		= [1, 4]

keys.SEND			= [1, 3]	# KB_SND
keys.CLEAR			= [2, 3]	# KB_CLR
keys.END_CALL		= [5, 1]	# END

keys.NUM1			= [1, 0]
keys.NUM2			= [1, 1]
keys.NUM3			= [1, 2]
keys.NUM4			= [2, 0]
keys.NUM5			= [2, 1]
keys.NUM6			= [2, 2]
keys.NUM7			= [3, 0]
keys.NUM8			= [3, 1]
keys.NUM9			= [3, 2]
keys.STAR			= [4, 0]	# KB_STAR
keys.NUM0			= [4, 1]	# 510
keys.HASH			= [4, 2]	# KB_SHA

keys.MUSIC			= [0, 3]	# KB_BGM
keys.CAMERA			= [0, 2]	# KB_CAM (side / shutter)
keys.VOLUME_UP		= [0, 0]	# KB_UP
keys.VOLUME_DOWN	= [0, 1]	# KB_DOWN

[startup.ONLINE]
duration = 5
keys = ["END_CALL"]

[startup.PTEST]
duration = 5
keys = ["STAR", "HASH", "END_CALL"]

[startup.OFFLINE]
keys = []
