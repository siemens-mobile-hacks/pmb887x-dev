[board]
vendor = "BenQ-Siemens"
model = "E71"
extends = "include/siemens-sg2-elka.toml"

[peripheral.LCD0]
type = "jbt6k71"
bus = "DIF"
width = 240
height = 320
rotation = 180
in = { CS = "DIF_CS1", CD = "DIF_CD", WR = "DIF_WR", RD = "DIF_RD", RESET = "DIF_RESET1" }

[peripheral.PMIC]
type = "d1094xx"
bus = "I2C"
addr = 0x31
revision = 0xAA

[peripheral.FM]
type = "tea5761uk"
bus = "I2C"
addr = 0x10

[gpio.aliases]
DIF_HD = "HW_DET_FM_RADIO"
USIF_TXD_MTSR = "A_FM_STANDBY"

[gpio.inputs]
# HWID 413
HW_DET_MOB_TYPE1=1
HW_DET_MOB_TYPE2=0
HW_DET_MOB_TYPE3=1
HW_DET_MOB_TYPE4=1
HW_DET_BLUETOOTH=0
HW_DET_BAND_SEL=0
HW_DET_FM_RADIO=1

# FM radio detection
MMCI_DAT1=1
