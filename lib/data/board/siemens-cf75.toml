[board]
vendor = "Siemens"
model = "CF75"
extends = "include/siemens-sgl-r65.toml"

# Schematic p. 8: D1203 is Intel JZ48F4000L0YTQ0 (V1) or AMD (V2); this is the AMD variant.
[peripheral.FLASH0]
flash = { vid = 0x0001, pid = [0x227E, 0x2230, 0x2200] }

[peripheral.RF]
type = "hd155165bp"
port = { RFSSC = "TPU:RFSSC0", IQ_TX = "DSP:IQ_RX" }

[gpio.inputs]
HW_DET_MOB_TYPE1 = 0
HW_DET_MOB_TYPE2 = 1
HW_DET_MOB_TYPE3 = 0
HW_DET_MOB_TYPE4 = 1
HW_DET_MOB_TYPE5 = 0
HW_DET_RF_TYPE = 0
HW_DET_BAND_SEL = 0
HW_DET_EXT_STEPUP = 0
