[board]
vendor = "Panasonic"
model = "705p"
platform = "apoxi"
cpu.type = "pmb8876"
cpu.rev = 0x11
cpu.uid0 = 0x030488E3
cpu.uid1 = 0x1B040288
cpu.uid2 = 0x000E0A0B
patterns = [
	{ offset = 0x40000, pattern = '"VS70"' },
]

[peripheral.SIM_SLOT]
type = "iso7816-slot"
bus = "SIM"
in = { RST = "SIM:CC_RST" }

[peripheral.FLASH0]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 0
flash = { vid = 0x0001, pid = [0x227E, 0x2230, 0x2200] }

[peripheral.FLASH1]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 2
flash = { vid = 0x0001, pid = [0x227E, 0x2230, 0x2200] }

[peripheral.SDRAM]
type = "sdram"
bus = "EBU"
ebu.cs = 1
ram.size = 0x2000000 # 32 Mb

[peripheral.PMIC]
type = "pmb6812"
bus = "I2C"
addr = 0x08

# Unverified: no schematic yet, so the AFE outputs drive speakers directly.
[peripheral.AFE_EP_SPEAKER]
type = "speaker"
port = { in = "DSP:AFE_EP" }

[peripheral.AFE_EPPA_SPEAKER]
type = "speaker"
port = { in = "DSP:AFE_EPPA" }

[dsp]
rom_version = 0x0801

[analog]
M_0 = { type = "resistor", value = 9300 }
M_1 = { type = "resistor_divider", r1 = 330000, r2 = 220000, value = 3700 }
M_7 = { type = "resistor", value = 14800 }
M_9 = { type = "resistor", value = 15000 }

[gpio.pull-resistors]
I2C_SCL = 1
I2C_SDA = 1

[gpio.inputs]
# BROM APP PLATFORM (A01)
PIN102 = 1
PIN32 = 0
PIN33 = 0

[keyboard]
# [KP_IN, KP_OUT, ..., KP_OUT], comments give the APOXI KeyCode
NAV_UP		= [3, 3]	# 0x10
NAV_RIGHT	= [0, 6]	# 0x13
NAV_CENTER	= [2, 3]	# 0x41
NAV_LEFT	= [0, 5]	# 0x12
NAV_DOWN	= [7, 6]	# 0x0F

SOFT_LEFT	= [2, 5]	# 0x2A
SOFT_RIGHT	= [3, 6]	# 0xB4
SEND		= [1, 3]	# 0xBD
END_CALL	= [5, 1]	# 0x15
CLEAR		= [0, 3]	# 0x40

NUM1		= [3, 0]
NUM2		= [3, 1]
NUM3		= [3, 2]
NUM4		= [2, 0]
NUM5		= [2, 1]
NUM6		= [2, 2]
NUM7		= [1, 0]
NUM8		= [1, 1]
NUM9		= [1, 2]
STAR		= [0, 0]	# 0x1C
NUM0		= [0, 1]	# 0x0A
HASH		= [0, 2]	# 0x0E

# Unidentified keys: [4, 0] 0x1E, [2, 6] 0xD2, [2, 7] 0x0B, [3, 7] 0xD3

[keyboard.gpio]
END_CALL = [{ target = "PMIC:ON" }]

[startup.ONLINE]
duration = 5
keys = ["END_CALL"]

[startup.PTEST]
duration = 5
keys = ["STAR", "HASH", "END_CALL"]

[startup.OFFLINE]
keys = []
