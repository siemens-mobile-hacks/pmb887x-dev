[board]
vendor = "Panasonic"
model = "705p"
platform = "apoxi"
cpu.type = "pmb8876"
cpu.rev = 0x11
cpu.uid0 = 0x030488E3
cpu.uid1 = 0x1B040288
cpu.uid2 = 0x000E0A0B
patterns = [
	{ offset = 0x40000, pattern = '"VS70"' },
]

[peripheral.SIM_SLOT]
type = "iso7816-slot"
bus = "SIM"
in = { RST = "SIM:CC_RST" }

[peripheral.FLASH0]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 0
flash = { vid = 0x0001, pid = [0x227E, 0x2230, 0x2200] }

[peripheral.FLASH1]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 2
flash = { vid = 0x0001, pid = [0x227E, 0x2230, 0x2200] }

[peripheral.UMTS]
type = "bcm2141"
bus = "EBU"
ebu.cs = 3
out = { IRQ = "UMTS_IRQ" }

[peripheral.SDRAM]
type = "sdram"
bus = "EBU"
ebu.cs = 1
ram.size = 0x2000000 # 32 Mb

[peripheral.PMIC]
type = "pmb6812"
bus = "I2C"
addr = 0x08

[peripheral.SD_SLOT]
type = "sd-slot"
port = { card = "MCI:CARD" }

# Unverified: no schematic yet, so the AFE outputs drive speakers directly.
[peripheral.AFE_EP_SPEAKER]
type = "speaker"
port = { in = "DSP:AFE_EP" }

[peripheral.AFE_EPPA_SPEAKER]
type = "speaker"
port = { in = "DSP:AFE_EPPA" }

[dsp]
rom_version = 0x0801

[analog]
M_0 = { type = "resistor", value = 9300 }
M_1 = { type = "resistor_divider", r1 = 330000, r2 = 220000, value = 3700 }
M_7 = { type = "resistor", value = 14800 }
M_9 = { type = "resistor", value = 15000 }

[gpio.aliases]
T_OUT8 = "UMTS_IRQ"

[gpio.pull-resistors]
I2C_SCL = 1
I2C_SDA = 1

[gpio.inputs]
# BROM APP PLATFORM (A01)
PIN102 = 1
PIN32 = 0
PIN33 = 0

[peripheral.END_KEY]
type = "key-switch"
key = "END_CALL"
level = 1
out = { out = "PMIC:ON" }

[peripheral.KEYPAD_MATRIX]
type = "key-matrix"
in = { in0 = "KP_OUT0", in1 = "KP_OUT1", in2 = "KP_OUT2", in3 = "KP_OUT3", in5 = "KP_IN6", in6 = "KP_IN5" }
out = { out0 = "KP_IN0", out1 = "KP_IN1", out2 = "KP_IN2", out3 = "KP_IN3", out5 = "DIF_RESET2", out7 = "T_OUT6" }
# keys.NAME = [out, in]
keys.NAV_UP		= [3, 3]	# 0x10
keys.NAV_RIGHT	= [0, 6]	# 0x13
keys.NAV_CENTER	= [2, 3]	# 0x41
keys.NAV_LEFT	= [0, 5]	# 0x12
keys.NAV_DOWN	= [7, 6]	# 0x0F

keys.SOFT_LEFT	= [2, 5]	# 0x2A
keys.SOFT_RIGHT	= [3, 6]	# 0xB4
keys.SEND		= [1, 3]	# 0xBD
keys.END_CALL	= [5, 1]	# 0x15
keys.CLEAR		= [0, 3]	# 0x40

keys.NUM1		= [3, 0]
keys.NUM2		= [3, 1]
keys.NUM3		= [3, 2]
keys.NUM4		= [2, 0]
keys.NUM5		= [2, 1]
keys.NUM6		= [2, 2]
keys.NUM7		= [1, 0]
keys.NUM8		= [1, 1]
keys.NUM9		= [1, 2]
keys.STAR		= [0, 0]	# 0x1C
keys.NUM0		= [0, 1]	# 0x0A
keys.HASH		= [0, 2]	# 0x0E

# Unidentified keys: [4, 0] 0x1E, [2, 6] 0xD2, [2, 7] 0x0B, [3, 7] 0xD3

[startup.ONLINE]
duration = 5
keys = ["END_CALL"]

[startup.PTEST]
duration = 5
keys = ["STAR", "HASH", "END_CALL"]

[startup.OFFLINE]
keys = []
