[board]
vendor = "BenQ-Siemens"
model = "SL98"
platform = "apoxi"
cpu.type = "pmb8876"
cpu.rev = 0x10
patterns = [
	{ offset = 0x40C00, pattern = '"DEMOBL SMARTI_PM SGOLD" 00' },
	{ pattern = '"SP85" 00 00 00 00 "SIEMENS" 00' },
]

[peripheral.LCD0]
type = "jbt6k71"
bus = "DIF"
width = 240
height = 320
rotation = 180
in = { ssi-gpio-cs = "DIF_CS1", CD = "DIF_CD", WR = "DIF_WR", RD = "DIF_RD", RESET = "DIF_RESET1" }

[peripheral.SIM_SLOT]
type = "iso7816-slot"
bus = "SIM"
in = { RST = "SIM:CC_RST" }

[peripheral.FLASH0]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 0
flash = { vid = 0x0089, pid = 0x887E }

[peripheral.FLASH1]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 2
flash = { vid = 0x0089, pid = 0x887E }

[peripheral.SDRAM]
type = "sdram"
bus = "EBU"
ebu.cs = 1
ram.size = 0x2000000 # 32 Mb

# No schematic: the wiring follows the firmware audio routes.
[peripheral.PMIC]
type = "pmb6812"
bus = "I2C"
addr = 0x08
port = { IN = "DSP:AFE_EPPA" }

[peripheral.SD_SLOT]
type = "sd-slot"
port = { card = "MCI:CARD" }

[peripheral.RECEIVER]
type = "speaker"
port = { in = "DSP:AFE_EP" }

[peripheral.LOUDSPEAKER]
type = "speaker"
port = { in = "PMIC:OUT" }

[peripheral.RF]
type = "pmb6272"
port = { RFSSC = "TPU:RFSSC0", IQ_TX = "DSP:IQ_RX" }

[analog]
M_0 = { type = "resistor", value = 9300 }
M_1 = { type = "resistor_divider", r1 = 330000, r2 = 220000, value = 3700 }
M_7 = { type = "resistor", value = 14800 }
M_9 = { type = "resistor", value = 15000 }

[dsp]
rom_version = 0x0801

[gpio.pull-resistors]
I2C_SCL = 1
I2C_SDA = 1

[gpio.aliases]
DSPOUT0 = "AC_DCD"
USART0_TXD = "AC_TX"
USART0_RXD = "AC_RX"
USART0_CTS = "AC_RTS"
USART0_RTS = "AC_CTS"

[gpio.inputs]
# Cable detect
AC_RTS = 1
AC_RX = 1

[peripheral.END_KEY]
type = "key-switch"
key = "END_CALL"
level = 1
out = { out = "PMIC:ON" }

[peripheral.KEYPAD_MATRIX]
type = "key-matrix"
in = { in0 = "KP_OUT0", in1 = "KP_OUT1", in2 = "KP_OUT2", in3 = "KP_OUT3", in5 = "KP_IN6" }
out = { out0 = "KP_IN0", out1 = "KP_IN1", out2 = "KP_IN2", out3 = "KP_IN3", out4 = "KP_IN4" }
# keys.NAME = [out, in]
keys.NAV_UP		= [0, 3]
keys.NAV_RIGHT	= [1, 3]
keys.NAV_CENTER	= [2, 3]
keys.NAV_LEFT	= [3, 3]
keys.NAV_DOWN	= [4, 3]

keys.SEND		= [0, 5]
keys.SOFT_LEFT	= [3, 5]
keys.SOFT_RIGHT	= [4, 5]

keys.NUM1		= [0, 0]
keys.NUM2		= [0, 1]
keys.NUM3		= [0, 2]

keys.NUM4		= [1, 0]
keys.NUM5		= [1, 1]
keys.NUM6		= [1, 2]

keys.NUM7		= [2, 0]
keys.NUM8		= [2, 1]
keys.NUM9		= [2, 2]

keys.STAR		= [3, 0]
keys.NUM0		= [3, 1]
keys.HASH		= [3, 2]

keys.END_CALL	= [4, 0]

[startup.ONLINE]
duration = 5
keys = ["END_CALL"]

[startup.PTEST]
duration = 5
keys = ["STAR", "HASH", "END_CALL"]

[startup.OFFLINE]
keys = []
