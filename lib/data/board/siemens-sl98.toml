[board]
vendor = "BenQ-Siemens"
model = "SL98"
cpu.type = "pmb8876"
cpu.rev = 0x10

[peripheral.LCD0]
type = "jbt6k71"
bus = "DIF"
width = 240
height = 320
rotation = 180
in = { CS = "DIF_CS1", CD = "DIF_CD", WR = "DIF_WR", RD = "DIF_RD", RESET = "DIF_RESET1" }

[peripheral.SIM_CARD]
type = "sim-card"
bus = "SIM"
in = { RST = "SIM:CC_RST" }

[peripheral.FLASH0]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 0
flash = { vid = 0x0089, pid = 0x887E }

[peripheral.FLASH1]
type = "cfi-flash"
bus = "EBU"
ebu.cs = 2
flash = { vid = 0x0089, pid = 0x887E }

[peripheral.SDRAM]
type = "sdram"
bus = "EBU"
ebu.cs = 1
ram.size = 0x2000000 # 32 Mb

[peripheral.PMIC]
type = "pmb6812"
bus = "I2C"
addr = 0x08

[peripheral.RF]
type = "pmb6272"
bus = "TPU:RFSSC"

[analog]
M_0 = { type = "resistor", value = 9300 }
M_1 = { type = "resistor_divider", r1 = 330000, r2 = 220000, value = 3700 }
M_7 = { type = "resistor", value = 14800 }
M_9 = { type = "resistor", value = 15000 }

[dsp]
ram0_value = 0x0801

[gpio.aliases]
DSPOUT0 = "AC_DCD"
USART0_TXD = "AC_TX"
USART0_RXD = "AC_RX"
USART0_CTS = "AC_RTS"
USART0_RTS = "AC_CTS"

[gpio.inputs]
# Cable detect
AC_RTS = 1
AC_RX = 1

[keyboard]
# [KP_IN, KP_OUT, ..., KP_OUT]
NAV_UP		= [0, 3]
NAV_RIGHT	= [1, 3]
NAV_CENTER	= [2, 3]
NAV_LEFT	= [3, 3]
NAV_DOWN	= [4, 3]

NUM1		= [0, 0]
NUM2		= [0, 1]
NUM3		= [0, 2]

NUM4		= [1, 0]
NUM5		= [1, 1]
NUM6		= [1, 2]

NUM7		= [2, 0]
NUM8		= [2, 1]
NUM9		= [2, 2]

STAR		= [3, 0]
NUM0		= [3, 1]
HASH		= [3, 2]

END_CALL	= [4, 0]

[keyboard.gpio]
END_CALL = [{ target = "PMIC:ON" }]

[startup.ONLINE]
duration = 5
keys = ["END_CALL"]

[startup.PTEST]
duration = 5
keys = ["STAR", "HASH", "END_CALL"]

[startup.OFFLINE]
keys = []
