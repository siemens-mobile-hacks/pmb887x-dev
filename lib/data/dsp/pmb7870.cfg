.type MODULE
.size 0x10000
.name PMB7870_DSP_DATA
.descr PMB7870 TeakLite data-space registers

// Source: PMB7870 Design Specification rev. 1.06, Table 12-1.
// Addresses are absolute 16-bit TeakLite data-space word addresses.
// Peripheral accesses normally take two wait states. AFE_RWADDR and
// BB_WR_POINTER reads take four wait states.

INT_FINTA0	0xE600	Interrupt A0 flag register (read-only, modified by hardware)
INT_EINTA0	0xE601	Interrupt A0 enable register
INT_RINTA0	0xE602	Interrupt A0 reset register (write-only)
INT_SINTA0	0xE603	Interrupt A0 set register (write-only)
INT_FINTB0	0xE604	Interrupt B0 flag register (read-only, modified by hardware)
INT_EINTB0	0xE605	Interrupt B0 enable register
INT_RINTB0	0xE606	Interrupt B0 reset register (write-only)
INT_SINTB0	0xE607	Interrupt B0 set register (write-only)
INT_FINT1	0xE608	Interrupt 1 flag register (read-only, modified by hardware)
INT_EINT1	0xE609	Interrupt 1 enable register
INT_RINT1	0xE60A	Interrupt 1 reset register (write-only)
INT_SINT1	0xE60B	Interrupt 1 set register (write-only)
INT_FINT2	0xE60C	Interrupt 2 flag register (read-only)
INT_EINT2	0xE60D	Interrupt 2 enable register
INT_RINT2	0xE60E	Interrupt 2 reset register (write-only)
INT_SINT2	0xE60F	Interrupt 2 set register (write-only)
INT_TOMCU	0xE610	DSP-to-MCU interrupt register (write-only)

CIPH_CSTAT	0xE620	GSM cipher status and control register
CIPH_KEY0	0xE621	GSM cipher key word 0
CIPH_KEY1	0xE622	GSM cipher key word 1
CIPH_KEY2	0xE623	GSM cipher key word 2
CIPH_KEY3	0xE624	GSM cipher key word 3
CIPH_TMOD26	0xE625	GSM cipher T modulo 26
CIPH_TMOD51	0xE626	GSM cipher T modulo 51
CIPH_SFNUM	0xE627	GSM cipher superframe number
CIPH_KEY4	0xE628	A53 cipher key word 4
CIPH_KEY5	0xE629	A53 cipher key word 5
CIPH_KEY6	0xE62A	A53 cipher key word 6
CIPH_KEY7	0xE62B	A53 cipher key word 7
CIPH_KDATA1	0xE62C	A53 cipher key data word 1
CIPH_KDATA2	0xE62D	A53 cipher key data word 2
CIPH_KDATA3	0xE62E	A53 cipher key data word 3
CIPH_KDATA4	0xE62F	A53 cipher key data word 4

TMR1_CTRL	0xE630	Timer 1 control register
TMR1_CNT	0xE631	Timer 1 counter register (read-only)
TMR1_INT0	0xE632	Timer 1 interrupt compare register 0
TMR1_INT1	0xE633	Timer 1 interrupt compare register 1
TMR2_CTRL	0xE634	Timer 2 control register
TMR2_CNT	0xE635	Timer 2 counter register
TMR2_MAX	0xE636	Timer 2 maximum register

VH_CONF1_EQ	0xE640	Equalizer accelerator configuration register 1 (write-only)
VH_CONF2_EQ	0xE641	Equalizer accelerator configuration register 2 (write-only)
VH_STATUS_EQ	0xE642	Equalizer accelerator status register (read-only)
VH_CONF_CNT_E	0xE643	Equalizer accelerator configuration counter
VH_STAT_CNT_E	0xE644	Equalizer accelerator status counter (read-only)
VH_SC_SOUT	0xE645	Equalizer accelerator soft output register
VH_SQUAL	0xE646	Equalizer accelerator signal quality register (read-only)

VH_CONF1_DEC	0xE650	Channel decoder accelerator configuration register 1 (write-only)
VH_CONF2_DEC	0xE651	Channel decoder accelerator configuration register 2
VH_STATUS_DEC	0xE652	Channel decoder accelerator status register (read-only)
VH_CONF_CNT_D	0xE653	Channel decoder accelerator configuration counter
VH_STAT_CNT_D	0xE654	Channel decoder accelerator status counter (read-only)
VH_REF_BR_BFLY0	0xE658	Channel decoder butterfly reference register 0
VH_REF_BR_BFLY1	0xE659	Channel decoder butterfly reference register 1
VH_REF_BR_BFLY2	0xE65A	Channel decoder butterfly reference register 2
VH_REF_BR_BFLY3	0xE65B	Channel decoder butterfly reference register 3
VH_REF_BR_BFLY4	0xE65C	Channel decoder butterfly reference register 4
VH_REF_BR_BFLY5	0xE65D	Channel decoder butterfly reference register 5
VH_REF_BR_BFLY6	0xE65E	Channel decoder butterfly reference register 6
VH_REF_BR_BFLY7	0xE65F	Channel decoder butterfly reference register 7

AFE_INTPTR	0xE670	Audio front-end interrupt pointer (write-only)
AFE_RWADDR	0xE671	Audio front-end read/write address (read-only, four read wait states)
AFE_BCON	0xE672	Audio front-end buffer control register
AFE_VRXCTRL1	0xE673	Audio front-end voice receive control register 1
AFE_VRXCTRL2	0xE674	Audio front-end voice receive control register 2
AFE_VTXCTRL	0xE675	Audio front-end voice transmit control register
AFE_RINGCTRL	0xE676	Audio front-end ringer control register

BB_CTRL	0xE680	Baseband receive control register
BB_INT_POINTER	0xE681	Baseband receive interrupt pointer
BB_WR_POINTER	0xE682	Baseband receive write pointer (read-only, four read wait states)
BB_STATUS	0xE683	Baseband receive status register (read-only)
BB_DCOFFSET_I	0xE684	Baseband receive I DC offset register
BB_DCOFFSET_Q	0xE685	Baseband receive Q DC offset register
BB_FSHIFT	0xE686	Baseband receive frequency shift register
BB_BRFILTER_CTRL	0xE687	Baseband receive filter control register
BB_PBASE_MSB	0xE688	Baseband receive Pbase high word (read-only)
BB_PBASE_LSB	0xE689	Baseband receive Pbase low word (read-only)
BB_PADJ_MSB	0xE68A	Baseband receive Padj high word (read-only)
BB_PADJ_LSB	0xE68B	Baseband receive Padj low word (read-only)
BB_IQ_IMBALANCE	0xE68C	Baseband receive I/Q imbalance register

DSP_CFSTA	0xE690	DSP communication flag status register (read-only)
DSP_CFSET	0xE691	DSP communication flag set register (write-only)
DSP_CFR	0xE692	DSP communication flag reset register (write-only)
MCU_SEM	0xE693	MCU semaphore status register (read-only)
MCU_SEMS	0xE694	MCU semaphore set register (write-only)
MCU_SEMR	0xE695	MCU semaphore reset register (write-only)
BIU_CTRL	0xE696	XBIU control register (write-only)
SD_ADDRL	0xE697	XBIU controller-space address low register (write-only)
SD_ADDRH	0xE698	XBIU controller-space address high register (write-only)
BIU_DATA_W	0xE699	XBIU write data register (write-only)
BIU_DATA_R	0xE699	XBIU read data register (read-only)

DSP_ID	0xE6A0	DSP identification register (read-only, hard-wired)
DSP_CTRL	0xE6A1	DSP control register (write-only)
DSP_DEBUG	0xE6A2	DSP debug register
DSP_PAGE	0xE6A3	DSP program and data ROM page register
DSP_DSPOUT	0xE6A8	DSP output register

MOD_CTRL	0xE6B0	GMSK modulator control register
MOD_STAT	0xE6B1	GMSK modulator status register (read-only)
MOD_INT_ADDR	0xE6B3	GMSK modulator interrupt address
MOD_OCI	0xE6B4	GMSK modulator I offset correction register
MOD_OCQ	0xE6B5	GMSK modulator Q offset correction register
MOD_ACI	0xE6B6	GMSK modulator I amplitude correction register
MOD_ACQ	0xE6B7	GMSK modulator Q amplitude correction register
MOD_FC	0xE6B8	GMSK modulator frequency correction register

SSCDSP_CON	0xE6C0	DSP synchronous serial controller control register
SSCDSP_TXB	0xE6C2	DSP synchronous serial controller transmit buffer
SSCDSP_RXB	0xE6C3	DSP synchronous serial controller receive buffer
SSCDSP_RXFCON	0xE6C4	DSP synchronous serial controller receive FIFO control register
SSCDSP_TXFCON	0xE6C5	DSP synchronous serial controller transmit FIFO control register
SSCDSP_FSTAT	0xE6C6	DSP synchronous serial controller FIFO status register (read-only)
SSCDSP_BR	0xE6C7	DSP synchronous serial controller baud-rate register
SSCDSP_FDV	0xE6C8	DSP synchronous serial controller fractional divider register

I2S1_CTRL	0xE6D0	I2S1 control register
I2S1_CSEL	0xE6D1	I2S1 clock select register
I2S1_RWADDR	0xE6D2	I2S1 read/write address register (read-only)
I2S1_NUM0	0xE6D3	I2S1 clock numerator 0
I2S1_DEN0	0xE6D4	I2S1 clock denominator 0
I2S1_NUM1	0xE6D5	I2S1 clock numerator 1
I2S1_DEN1	0xE6D6	I2S1 clock denominator 1
I2S1_RXCONF	0xE6D7	I2S1 receive configuration register
I2S1_RXINTADDR	0xE6D8	I2S1 receive interrupt address
I2S1_TXCONF	0xE6D9	I2S1 transmit configuration register
I2S1_TXINTADDR	0xE6DA	I2S1 transmit interrupt address

I2S2_CTRL	0xE6E0	I2S2 control register
I2S2_CSEL	0xE6E1	I2S2 clock select register
I2S2_RWADDR	0xE6E2	I2S2 read/write address register (read-only)
I2S2_NUM0	0xE6E3	I2S2 clock numerator 0
I2S2_DEN0	0xE6E4	I2S2 clock denominator 0
I2S2_NUM1	0xE6E5	I2S2 clock numerator 1
I2S2_DEN1	0xE6E6	I2S2 clock denominator 1
I2S2_RXCONF	0xE6E7	I2S2 receive configuration register
I2S2_RXINTADDR	0xE6E8	I2S2 receive interrupt address
I2S2_TXCONF	0xE6E9	I2S2 transmit configuration register
I2S2_TXINTADDR	0xE6EA	I2S2 transmit interrupt address

I2S3_CTRL	0xE6F0	I2S3 control register
I2S3_CSEL	0xE6F1	I2S3 clock select register
I2S3_RADDR	0xE6F2	I2S3 read address register (read-only)
I2S3_NUM	0xE6F3	I2S3 clock numerator
I2S3_DEN	0xE6F4	I2S3 clock denominator
I2S3_TXCONF	0xE6F9	I2S3 transmit configuration register
I2S3_TXINTADDR	0xE6FA	I2S3 transmit interrupt address
