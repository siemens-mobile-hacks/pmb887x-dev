.type MODULE
.size 0x09
.name DSP
.descr SoC-specific TeakLite control registers

ID		0x00	DSP identification register (read-only, hard-wired)
	DSPID		0	16	Hardware revision number

CTRL	0x01	DSP control register (write-only)
	DSPDIS		0	1	Disable the TeakLite core clock

DEBUG	0x02	DSP debug register
	OCEM		1	1	OCEM peripheral clock status

PAGE	0x03	Program and data ROM page register
	DATA_PAGE	0	1	Data ROM page select
	PROG_PAGE	1	1	Program ROM page select

UNK6	0x06	Undocumented register used by Mask ROM 0604 and 0801

DSPOUT	0x08	DSP output register
	DSPOUT0		0	1	DSP output pin 0
	DSPOUT1		1	1	DSP output pin 1
	DSPOUT2		2	1	DSP output pin 2
	DSPIN0		3	1	Latched DSP input pin 0
	DSPIN1		4	1	Latched DSP input pin 1
	MONIN1		5	1	Latched monitor input pin 1
	MONIN2		6	1	Latched monitor input pin 2
	MONIN3		7	1	Latched DSP_INT3 input
	MONIN4		8	1	Latched DSP_INT4 input
