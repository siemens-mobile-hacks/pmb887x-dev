.type MODULE
.size 0x04
.name XBIU
.descr DSP-to-controller bus interface unit

CTRL		0x00	Control register (read/write)
	RQACK		0	1	Transfer request and acknowledge
	INSTR		1	2	Transfer instruction
		BYTE_WRITE=1
		WORD_WRITE=2
		WORD_READ=3

SD_ADDRL	0x01	Controller-space address low register (read/write)
	ADDR		0	16	Controller-space address bits 15:0

SD_ADDRH	0x02	Controller-space address high register (read/write)
	ADDR		0	8	Controller-space address bits 23:16

DATA_W		0x03	Write data register (write-only)
	DATA		0	16	Data written to controller space

DATA_R		0x03	Read data register (read-only)
	DATA		0	16	Data read from controller space
