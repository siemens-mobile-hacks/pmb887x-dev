.type MODULE
.size 0x10
.name CHANNEL_DECODER
.descr GSM channel decoder accelerator

CONF1			0x00	Configuration register 1 (write-only)
	RES_RW1_RW2		0	1	Select RAMW1 or RAMW2
	RES_SIN01_BASE	1	1	Reset RAM2 pointer to SIN01 base
	RES_SIN2_BASE	2	1	Reset RAM2 pointer to SIN2 base
	RES_TR_BASE		3	1	Reset RAM2 pointer to traceback base
	RES_DM_BASE		7	1	Reset RAMW1/RAMW2 pointer to decision-metric base

CONF2			0x01	Configuration register 2
	HW_ENA_DEC		0	1	Decoder hardware clock enable
	RES_DEC			1	1	Reset Viterbi decoder
	DEC_ON			2	1	Start Viterbi decoding
	RES_ALL			8	1	Reset all internal registers
	DEC_FLAG_RD		11	1	External RAM access direction
	PC_DEC_0		12	1	RAMW1/RAMW2 packing mode
	PC_DEC_1		13	1	RAM2 packing mode
	OFLOW_PROT		14	1	Metric overflow protection enable
	DEC_64			15	1	64-state decoder select

STATUS			0x02	Status register (read-only)
	DEC_BUSY		14	1	Viterbi decoding in progress

CONF_CNT		0x03	Configuration counter
	C_DEC			0	8	Number of bits to decode

STAT_CNT		0x04	Status counter (read-only)
	S_DEC			0	8	Number of bits already decoded

REF_BR_BFLY0	0x08	Butterfly reference register 0
	REF1			0	4	Branch metric reference 1
	REF2			4	4	Branch metric reference 2
	REF3			8	4	Branch metric reference 3
	REF4			12	4	Branch metric reference 4

REF_BR_BFLY1	0x09	Butterfly reference register 1
	REF1			0	4	Branch metric reference 1
	REF2			4	4	Branch metric reference 2
	REF3			8	4	Branch metric reference 3
	REF4			12	4	Branch metric reference 4

REF_BR_BFLY2	0x0A	Butterfly reference register 2
	REF1			0	4	Branch metric reference 1
	REF2			4	4	Branch metric reference 2
	REF3			8	4	Branch metric reference 3
	REF4			12	4	Branch metric reference 4

REF_BR_BFLY3	0x0B	Butterfly reference register 3
	REF1			0	4	Branch metric reference 1
	REF2			4	4	Branch metric reference 2
	REF3			8	4	Branch metric reference 3
	REF4			12	4	Branch metric reference 4

REF_BR_BFLY4	0x0C	Butterfly reference register 4
	REF1			0	4	Branch metric reference 1
	REF2			4	4	Branch metric reference 2
	REF3			8	4	Branch metric reference 3
	REF4			12	4	Branch metric reference 4

REF_BR_BFLY5	0x0D	Butterfly reference register 5
	REF1			0	4	Branch metric reference 1
	REF2			4	4	Branch metric reference 2
	REF3			8	4	Branch metric reference 3
	REF4			12	4	Branch metric reference 4

REF_BR_BFLY6	0x0E	Butterfly reference register 6
	REF1			0	4	Branch metric reference 1
	REF2			4	4	Branch metric reference 2
	REF3			8	4	Branch metric reference 3
	REF4			12	4	Branch metric reference 4

REF_BR_BFLY7	0x0F	Butterfly reference register 7
	REF1			0	4	Branch metric reference 1
	REF2			4	4	Branch metric reference 2
	REF3			8	4	Branch metric reference 3
	REF4			12	4	Branch metric reference 4
