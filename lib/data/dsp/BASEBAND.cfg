.type MODULE
.size 0x0D
.name BASEBAND
.descr GSM baseband receive unit

CTRL			0x00	Control register
	BB_STOP		0	1	Override hardware control and stop filter
	CORDICON	1	1	CORDIC block enable
	BB_ON		2	1	Baseband clock enable
	BB_ADCMODE	3	1	Enhanced ADC mode enable
	BBADAP_EN	4	1	Adaptive filter mode enable

INT_POINTER		0x01	Interrupt pointer
	VALUE		0	10	Baseband RAM interrupt position

WR_POINTER		0x02	Write pointer (read-only)
	VALUE		0	10	Current baseband RAM write position

STATUS			0x03	Status register (read-only)
	EQON		0	1	Equalizer trigger status
	FCON		1	1	Frequency-correction trigger status
	MONON		2	1	Monitor trigger status
	SCON		3	1	Synchronization trigger status
	RXON		4	1	Receiver trigger status

DCOFFSET_I		0x04	I DC offset register
	VALUE		0	16	I-component DC offset correction

DCOFFSET_Q		0x05	Q DC offset register
	VALUE		0	16	Q-component DC offset correction

FSHIFT			0x06	Frequency shift register
	VALUE		0	16	Frequency shift correction

BRFILTER_CTRL	0x07	Baseband receive filter control register
	LENGTH		0	8	Filter order divided by two
	SCALING		8	4	Filter gain scaling
	DECIMATION	12	1	Decimation filter enable

PBASE_MSB		0x08	Pbase high word (read-only)
	VALUE		0	8	Estimated wanted-signal power bits 23:16

PBASE_LSB		0x09	Pbase low word (read-only)
	VALUE		0	16	Estimated wanted-signal power bits 15:0

PADJ_MSB		0x0A	Padj high word (read-only)
	VALUE		0	8	Estimated adjacent-channel power bits 23:16

PADJ_LSB		0x0B	Padj low word (read-only)
	VALUE		0	16	Estimated adjacent-channel power bits 15:0

IQ_IMBALANCE	0x0C	I/Q imbalance register
