.type MODULE
.size 0x07
.name EQUALIZER
.descr GSM equalizer accelerator

CONF1		0x00	Configuration register 1 (write-only)
	RES_RW1_RW2		0	1	Select RAMW1 or RAMW2
	RES_RX_BASE		2	1	Reset RAM1 pointer to received-value base
	RES_BPAR_BASE	3	1	Reset RAM1 pointer to branch-partial-sum base
	RES_SOUT_BASE	4	1	Reset RAM2 pointer to soft-output base
	RES_HOUT_BASE	5	1	Reset RAM2 pointer to hard-output base
	RES_ELAT_BASE	7	1	Reset RAM2 pointer to equalizer-latency base
	RES_EMR_BASE	11	1	Reset RAMW1/RAMW2 pointer to right metric base
	RES_EML_BASE	12	1	Reset RAMW1/RAMW2 pointer to left metric base
	RES_EPR_BASE	13	1	Reset RAMW1/RAMW2 pointer to right path base
	RES_EPL_BASE	14	1	Reset RAMW1/RAMW2 pointer to left path base
	RES_EB_BASE		15	1	Reset RAMW1/RAMW2 pointer to branch-metric base

CONF2		0x01	Configuration register 2
	HW_ENA_EQ		0	1	Equalizer hardware clock enable
	RES_EQ			1	1	Reset equalization
	EQ_ON			2	1	Start Viterbi equalization
	RES_ALL			8	1	Reset all internal registers
	S_SEG			9	1	Combined soft-output packing mode
	S_COMB			10	1	Combine soft and hard outputs
	EQ_FLAG_RD		11	1	External RAM access direction
	PC_EQ_0			12	1	RAM1/RAMW1/RAMW2 packing mode
	PC_EQ_1			13	1	RAM2 packing mode
	EQ_RIGHT		14	1	Right half-slot equalization select
	EQ_EDGE			15	1	EDGE equalization mode enable

STATUS		0x02	Status register (read-only)
	EQ_BUSY			15	1	Equalization in progress

CONF_CNT	0x03	Configuration counter
	C_EQ			0	6	Number of symbols to equalize

STAT_CNT	0x04	Status counter (read-only)
	S_EQ			0	6	Number of symbols already equalized

SC_SOUT		0x05	Soft output register
	SC7_0			0	8	Soft-output shift selection
	SC8				8	1	Second shift stage enable
	SC12_9			9	4	Soft-output saturation selection
	SC13			13	1	Scaling accuracy control bit 13
	SC14			14	1	Scaling accuracy control bit 14
	SC15			15	1	Scaling accuracy control bit 15

SQUAL		0x06	Signal quality register (read-only)
	SQ				0	16	RX_QUAL histogram FIFO output
