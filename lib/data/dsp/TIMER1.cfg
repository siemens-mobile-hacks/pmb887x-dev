.type MODULE
.size 0x04
.name TIMER1
.descr TeakLite peripheral timer 1

CTRL	0x00	Control register
	DT1ENA	0	1	Timer clock enable
	RESTART	1	1	Restart timer from zero
	DT1ACT	2	1	Timer active status

CNT		0x01	Counter register (read-only)
	T1CNT	0	12	Current counter value

INT0	0x02	Interrupt compare register 0
	T1INT0	0	12	Interrupt compare value 0

INT1	0x03	Interrupt compare register 1
	T1INT1	0	12	Interrupt compare value 1
