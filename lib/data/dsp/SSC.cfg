.type MODULE
.size 0x09
.name SSC
.descr TeakLite synchronous serial controller

CON		0x00	Control register
	BM			0	4	Transfer data width minus one in programming mode
	BC			0	4	Shifted bit count in operating mode
	HB			4	1	LSB/MSB heading control
	PH			5	1	Clock phase
	PO			6	1	Clock polarity
	LB			7	1	Loopback enable
	TEN			8	1	Transmit error checking enable
	TE			8	1	Transmit error flag in operating mode
	REN			9	1	Receive error checking enable
	RE			9	1	Receive error flag in operating mode
	PEN			10	1	Phase error checking enable
	PE			10	1	Phase error flag in operating mode
	BEN			11	1	Baud-rate error checking enable
	BE			11	1	Baud-rate error flag in operating mode
	AREN		12	1	Automatic reset on baud-rate error
	BSY			12	1	Transfer busy flag in operating mode
	CLKON		13	1	Module clock enable
	MS			14	1	Master mode select
	EN			15	1	Module enable and programming/operating mode select

TXB		0x02	Transmit buffer
	VALUE		0	16	Transmit data

RXB		0x03	Receive buffer
	VALUE		0	16	Received data

RXFCON	0x04	Receive FIFO control register
	EN			0	1	Receive FIFO enable
	FLU			1	1	Receive FIFO flush
	TMEN		2	1	Receive FIFO transparent mode enable
	ITL			8	6	Receive FIFO interrupt trigger level

TXFCON	0x05	Transmit FIFO control register
	EN			0	1	Transmit FIFO enable
	FLU			1	1	Transmit FIFO flush
	TMEN		2	1	Transmit FIFO transparent mode enable
	ITL			8	6	Transmit FIFO interrupt trigger level

FSTAT	0x06	FIFO status register (read-only)
	RXFFL		0	6	Receive FIFO fill level
	TXFFL		8	6	Transmit FIFO fill level

BR		0x07	Baud-rate register
	VALUE		0	16	Baud-rate timer reload value

FDV		0x08	Fractional divider register
	VALUE		0	9	Fractional divider value
