.type MODULE
.size 0x07
.name AFE
.descr Voice audio front end

INTPTR		0x00	Interrupt pointer (write-only)
	RXINTPTR	0	6	Receive ring-buffer interrupt position
	TXINTPTR	8	6	Transmit ring-buffer interrupt position

RWADDR		0x01	Read/write address (read-only)
	RDADDR		0	6	Receive ring-buffer read position
	WRADDR		8	6	Transmit ring-buffer write position

BCON		0x02	Buffer control register
	MODE		0	1	Audio front-end operation enable
	RXSTART		1	1	Receive path start
	RXRATE		2	3	Receive interpolation rate
		KHZ_8=0
		KHZ_16=1
		KHZ_31_746=2
		KHZ_44_444=3
		KHZ_47_619=4
	TXSTART		5	1	Transmit path start
	TXRATE		6	1	Transmit output rate
		KHZ_8=0
		KHZ_16=1

VRXCTRL1	0x03	Voice receive control register 1
	EPSAV		2	1	Earpiece power-save mode
	VCMEPB		4	3	Earpiece buffer common-mode voltage
	RXGAINSP	7	3	Line-out buffer gain
	RXGAINPA	10	3	Power audio buffer gain
	RXDITH		14	2	Receive DAC dither control

VRXCTRL2	0x04	Voice receive control register 2
	RXDAC		0	1	Receive channel DAC enable
	RINGSELSP	2	1	Line-out buffer ringer mode
	RINGSELPA	3	1	Power audio buffer ringer mode
	VEPPA		4	1	Power audio buffer enable
	VEPSP		6	1	Line-out buffer enable
	ZERODETECT	7	1	Zero-detect enable
	MODE		14	1	Analog ringer mode select

VTXCTRL		0x05	Voice transmit control register
	TXDITH		0	1	Transmit ADC dither enable
	TXGAIN0		1	1	3 dB gain stage enable
	TXGAIN1		2	1	6 dB gain stage enable
	TXGAIN2		3	1	12 dB gain stage enable
	TXGAIN3		4	1	24 dB gain stage enable
	TXMODE		5	2	Transmit analog operation mode
		POWER_DOWN=0
		TALK=1
	TXINSEL		8	3	Transmit input source
		MIC2=2
		MIC1=4
	VMIC		11	2	Microphone supply voltage
		POWER_DOWN=0
		VOLT_1_8=1
		VOLT_2_0=2
		VOLT_2_2=3

RINGCTRL	0x06	Ringer control register
	ALTRIN		0	1	Alternative ringer output enable
	RINS		1	2	Ringer input source
		CAPCOM0=0
		CAPCOM1=1
		ALTERNATIVE=2
