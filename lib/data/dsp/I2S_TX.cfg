.type MODULE
.size 0x0B
.name I2S_TX
.descr Unidirectional TeakLite serial audio interface

CTRL		0x00	Control register
	I2SON		0	1	Module clock enable
	I2STXSTART	1	1	Start data transmission
	TXPCM		5	1	Transmit PCM mode select

CSEL		0x01	Clock select register
	TXCLKSEL	1	1	Transmit clock source
	CLKSEL		3	1	External clock source

RADDR		0x02	Read address register (read-only)
	RDADDR		0	6	Transmit ring-buffer read position

NUM			0x03	Clock numerator
	NUMERATOR	0	11	Fractional divider numerator
	FREF		12	2	Reference frequency select
		MODULE_CLOCK=0
		CLOCK_104MHZ=1

DEN			0x04	Clock denominator
	DENOMINATOR	0	16	Fractional divider denominator

TXCONF		0x09	Transmit configuration register
	EDGE		0	1	Transmit output edge
	DEL			1	1	First-bit delay
	POL			2	1	Word-address polarity
	PERIOD		3	2	Frame period
		CLOCKS_64=0
		CLOCKS_48=1
		CLOCKS_32=2
	WIDTH		5	3	Sample width
		BITS_16=0
		BITS_18=4
		BITS_20=5
		BITS_24=6
		BITS_32=7
	ALIGN		8	1	Data alignment
	MONO		9	2	Channel duplication mode
		STEREO=0
		RIGHT=2
		LEFT=3
	MUTE_L		11	1	Mute left channel
	MUTE_R		12	1	Mute right channel
	CLK_OUT		13	1	PCM burst clock output level
	CLK_CONT	14	1	Continuous PCM burst clock
	WA_LEN		15	1	PCM word-address pulse length

TXINTADDR	0x0A	Transmit interrupt address
	TXINTPTR	0	6	Transmit ring-buffer interrupt position
