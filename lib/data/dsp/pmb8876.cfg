.type MODULE
.size 0x10000
.name PMB8876_DSP_DATA
.descr PMB8876 TeakLite data-space registers confirmed on hardware

// Addresses are absolute 16-bit TeakLite data-space word addresses.
// Only names confirmed independently of the PMB7870 address relocation belong
// here. Keep the remaining DE00-DEFF candidates in the discovery evidence until
// their functions are confirmed on PMB8876 hardware.

DSP_ID		0xDEA0	DSP identification register (read-only, reset value E101 on PMB8876 rev 10)
DSP_PAGE	0xDEA3	DSP program and data ROM page register
