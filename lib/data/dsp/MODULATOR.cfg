.type MODULE
.size 0x0B
.name MODULATOR
.descr GMSK modulator unit

CTRL		0x00	Control register
	IQSWAP		0	1	Swap I and Q outputs
	MSWACT		8	1	Software modulator clock enable

STAT		0x01	Status register (read-only)
	MSTAT		0	1	Modulator active status

INT_ADDR	0x03	Interrupt address
	MINT_ADDR	0	9	Dual-port RAM interrupt address

OCI			0x04	I offset correction register
	VALUE		0	12	Signed I offset correction value

OCQ			0x05	Q offset correction register
	VALUE		0	12	Signed Q offset correction value

ACI			0x06	I amplitude correction register
	VALUE		0	8	I amplitude correction value

ACQ			0x07	Q amplitude correction register
	VALUE		0	8	Q amplitude correction value

FC			0x08	Frequency correction register
	VALUE		0	12	Signed GMSK frequency correction value

UNK9		0x09	Undocumented MODU_INIT command parameter register

UNKA		0x0A	Undocumented MODU_INIT command parameter register
