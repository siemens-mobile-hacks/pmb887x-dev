.type MODULE
.size 0x10
.name CIPHER
.descr GSM A51, A52, and A53 cipher unit

CSTAT		0x00	Status and control register
	CACT		0	1	Cipher unit active and start
	A52			1	1	A52 algorithm select in A51/A52 mode
	EDGE		2	1	EDGE mode select
	INIT		3	1	A53 initialization phase active
	A53			4	1	A53 cipher block enable and select

KEY0		0x01	Key word 0
	VALUE		0	16	Cipher key bits 15:0

KEY1		0x02	Key word 1
	VALUE		0	16	Cipher key bits 31:16

KEY2		0x03	Key word 2
	VALUE		0	16	Cipher key bits 47:32

KEY3		0x04	Key word 3
	VALUE		0	16	Cipher key bits 63:48

TMOD26		0x05	A51/A52 T modulo 26; reserved in A53 mode
	T26N		0	5	TDMA frame number modulo 26

TMOD51		0x06	A51/A52 T modulo 51; reserved in A53 mode
	T51N		0	6	TDMA frame number modulo 51

SFNUM		0x07	A51/A52 superframe number; reserved in A53 mode
	SFN			0	11	Superframe number within a hyperframe

KEY4		0x08	A53 key word 4
	VALUE		0	16	Cipher key bits 79:64

KEY5		0x09	A53 key word 5
	VALUE		0	16	Cipher key bits 95:80

KEY6		0x0A	A53 key word 6
	VALUE		0	16	Cipher key bits 111:96

KEY7		0x0B	A53 key word 7
	VALUE		0	16	Cipher key bits 127:112

KDATA1		0x0C	A53 key data word 1
	CE			0	16	KGCORE CE parameter

KDATA2		0x0D	A53 key data word 2
	CA			0	8	KGCORE CA parameter
	CD			10	1	KGCORE CD parameter
	CB			11	5	KGCORE CB parameter

KDATA3		0x0E	A53 key data word 3
	T26N		0	5	TDMA frame number modulo 26
	T51N		5	6	TDMA frame number modulo 51
	SFN			11	5	Superframe number bits 4:0

KDATA4		0x0F	A53 key data word 4
	SFN			0	6	Superframe number bits 10:5
