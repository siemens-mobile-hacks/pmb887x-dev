.name tea5761uk
.descr NXP TEA5761UK low-voltage single-chip FM stereo radio
.addr 0x10

# The TEA5761UK does not use I2C subaddresses. Register addresses below are byte
# positions in a read transfer. Write positions must be mapped by the consumer.
#
# W     R     Register
# -     0x00  INTREG_STATUS
# 0x00  0x01  INTREG_MASK
# 0x01  0x02  FRQSET_HIGH
# 0x02  0x03  FRQSET_LOW
# 0x03  0x04  TNCTRL_CONTROL
# 0x04  0x05  TNCTRL_AUDIO
# -     0x06  FRQCHK_HIGH
# -     0x07  FRQCHK_LOW
# -     0x08  TUNCHK_IF
# -     0x09  TUNCHK_STATUS
# 0x05  0x0A  TESTREG_CONTROL
# 0x06  0x0B  TESTREG_CONFIG
# -     0x0C  MANID_HIGH
# -     0x0D  MANID_LOW
# -     0x0E  CHIPID_HIGH
# -     0x0F  CHIPID_LOW

INTREG_STATUS		0x00		Interrupt and tuner-state flags
	IFFLAG			4	1	IF count validity flag
		IF_COUNT_CORRECT=0
		IF_COUNT_INCORRECT=1
	LEVFLAG			3	1	RSSI threshold flag
		LEVEL_ABOVE_THRESHOLD=0
		LEVEL_BELOW_THRESHOLD=1
	FRRFLAG			1	1	Tuner state-machine ready flag
		TUNER_NOT_READY=0
		TUNER_READY=1
	BLFLAG			0	1	Search band-limit or timeout flag
		BAND_LIMIT_NOT_REACHED=0
		BAND_LIMIT_REACHED_OR_TIMEOUT=1

INTREG_MASK			0x01		Tuner-flag hardware-interrupt enables
	IFMSK			4	1	IFFLAG hardware-interrupt enable
		DISABLED=0
		ENABLED=1
	LEVMSK			3	1	LEVFLAG hardware-interrupt enable
		DISABLED=0
		ENABLED=1
	FRRMSK			1	1	FRRFLAG hardware-interrupt enable
		DISABLED=0
		ENABLED=1
	BLMSK			0	1	BLFLAG hardware-interrupt enable
		DISABLED=0
		ENABLED=1

FRQSET_HIGH			0x02		Search direction, tuning mode, and frequency MSBs
	SUD				7	1	Search direction
		SEARCH_DOWN=0
		SEARCH_UP=1
	SM				6	1	Preset or search tuning mode
		PRESET=0
		SEARCH=1
	FR_13_08		0	6	Frequency setting bits 13 to 8

FRQSET_LOW			0x03		Frequency setting LSBs
	FR_07_00		0	8	Frequency setting bits 7 to 0

TNCTRL_CONTROL		0x04		Power, band, IF timing, and audio processing control
	PUPD			6	1	FM receiver power control
		FM_OFF=0
		FM_ON=1
	BLIM			5	1	FM tuning band selection
		US_EUROPE=0
		JAPAN=1
	SWPM			4	1	Software-port signal source
		SWP_OUTPUT=0
		FRRFLAG_OUTPUT=1
	IFCTC			3	1	IF count duration
		COUNT_1_953_MS=0
		COUNT_15_625_MS=1
	AFM				2	1	Left and right audio mute
		AUDIO_ACTIVE=0
		AUDIO_MUTED=1
	SMUTE			1	1	Soft-mute enable
		OFF=0
		ON=1
	SNC				0	1	Stereo noise-cancellation enable
		OFF=0
		ON=1

TNCTRL_AUDIO		0x05		Mute, search, injection, mono, port, and de-emphasis control
	MU				7	1	Left and right hard mute
		NOT_MUTED=0
		HARD_MUTED=1
	SSL				5	2	Search stop-level threshold
		ADC3=0
		ADC5=1
		ADC7=2
		ADC10=3
	HLSI			4	1	Mixer injection side
		LOW_SIDE=0
		HIGH_SIDE=1
	MST				3	1	Stereo or forced-mono mode
		STEREO=0
		FORCED_MONO=1
	SWP				2	1	Software-port output level
		LOW=0
		HIGH=1
	DTC				1	1	De-emphasis time constant
		DEEMPHASIS_75_US=0
		DEEMPHASIS_50_US=1
	AHLSI			0	1	Stop search on failed IF count and valid level
		CONTINUOUS_SEARCH=0
		STOP_ON_FAILED_IF_COUNT=1

FRQCHK_HIGH			0x06		Detected frequency PLL word MSBs
	PLL_13_08		0	6	Detected frequency bits 13 to 8

FRQCHK_LOW			0x07		Detected frequency PLL word LSBs
	PLL_07_00		0	8	Detected frequency bits 7 to 0

TUNCHK_IF			0x08		IF count and PLL tuning timeout
	IF_6_0			1	7	Intermediate-frequency count
	TUNTO			0	1	PLL tuning timeout flag
		PLL_SETTLED=0
		TUNING_TIMEOUT=1

TUNCHK_STATUS		0x09		Signal level, PLL lock, and pilot-detection status
	LEV_3_0			4	4	Received-signal level count
	LD				3	1	PLL lock flag
		PLL_NOT_LOCKED=0
		PLL_LOCKED=1
	STEREO			2	1	Stereo-pilot detection flag
		NO_PILOT=0
		PILOT_DETECTED=1

TESTREG_CONTROL		0x0A		Audio mute, hysteresis, reference, LNA, RF AGC, and interrupt control
	LHM				7	1	Left audio hard mute
		NOT_MUTED=0
		HARD_MUTED=1
	RHM				6	1	Right audio hard mute
		NOT_MUTED=0
		HARD_MUTED=1
	LHSW			4	1	RSSI level hysteresis
		SMALL=0
		LARGE=1
	TRIGFR			3	1	Reference-frequency input source
		XTAL=0
		FREQIN=1
	LDX				2	1	LNA local/DX gain mode
		NORMAL_GAIN=0
		REDUCED_GAIN_6_DB=1
	RFAGC			1	1	RF automatic gain control
		ON=0
		OFF=1
	INTCTRL			0	1	INTX interrupt generation enable
		DISABLED=0
		ENABLED=1

TESTREG_CONFIG		0x0B		Detection time and software-port test mode
	DETT			7	1	Detection time
		SLOW_8_MS=0
		FAST_4_MS=1
	TM				4	1	Test mode and software-port test output enable
		NORMAL=0
		TEST_MODE=1
	TB_3_0			0	4	Software-port test signal selection

MANID_HIGH			0x0C		Version code and manufacturer ID MSBs
	VERSION			4	4	Device version code
	MAN_ID_10_07	0	4	Manufacturer ID bits 10 to 7

MANID_LOW			0x0D		Manufacturer ID LSBs and availability
	MAN_ID_06_00	1	7	Manufacturer ID bits 6 to 0
	IDAV			0	1	Manufacturer ID availability flag
		NOT_AVAILABLE=0
		AVAILABLE=1

CHIPID_HIGH			0x0E		Chip identification code MSBs
	CHIP_ID_15_08	0	8	Chip ID bits 15 to 8

CHIPID_LOW			0x0F		Chip identification code LSBs
	CHIP_ID_07_00	0	8	Chip ID bits 7 to 0
