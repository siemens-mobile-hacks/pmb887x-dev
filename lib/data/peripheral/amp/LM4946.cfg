.name lm4946
.descr TI/National LM4946 Boomer audio power amplifier
.addr 0x7D
.qemu_dir hw/audio/lm4946

MODE				0x00		Output mode and shutdown control
	MC				0	3	Output mode select
		ALL_SHUTDOWN=0
		MONO_IN_TO_SPK=1
		MONO_IN_TO_HP=2
		LINE_IN_TO_SPK=3
		LINE_IN_TO_HP=4
		LINE_MONO_TO_SPK=5
		LINE_MONO_TO_HP=6
		LINE_IN_TO_SPK_HP=7
	OCL				3	1	Single-ended output-capacitor-less mode

N3D					0x40		Programmable 3D enhancement
	EN				0	1	Enable 3D enhancement
	NARROW			1	1	Soundstage width
		WIDE=0
		NARROW=1
	LEVEL			2	2	Enhancement level
		LOW=0
		MEDIUM=1
		HIGH=2
		MAX=3

MONO_VOL			0x80		Mono (MONO_IN) volume
	VOL				0	5	Volume code from -54 dB (0x00) through 0 dB (0x13) to +18 dB (0x1F)

LEFT_VOL			0xC0		Left (LIN) volume
	VOL				0	5	Volume code from -54 dB (0x00) through 0 dB (0x13) to +18 dB (0x1F)

RIGHT_VOL			0xE0		Right (RIN) volume
	VOL				0	5	Volume code from -54 dB (0x00) through 0 dB (0x13) to +18 dB (0x1F)
