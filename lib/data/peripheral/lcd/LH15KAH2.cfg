.name lh15kah2
.descr Sharp LH15KAH2 130x130 color LCD module, firmware panel ID 0x28, controller unidentified

# Recovered from the C72 firmware driver. A window register is written as one RS=1 word with the register
# index in bits 15:8 and the value in bits 7:0; RS=0 words are RGB565 pixels for the window cursor. The
# initialization words are not decoded: some carry multi-word parameter data, not register writes.

X_START				0x04		Window start column, also loads the column cursor
	ADDR			0	8	Column address

Y_START				0x05		Window start row, also loads the row cursor
	ADDR			0	8	Row address

X_END				0x06		Window end column
	ADDR			0	8	Column address

Y_END				0x07		Window end row
	ADDR			0	8	Row address
