.name pcf8833
.descr Philips PCF8833 132x132 STN RGB LCD controller

NOP					0x00		No operation

SWRESET				0x01		Software reset

BSTROFF				0x02		Booster voltage off

BSTRON				0x03		Booster voltage on

RDDIDIF				0x04		Read 24-bit display identification
	MODULE_CODE		0	8	Driver or module code
	VERSION			8	7	Driver or module version ID
	MODULE_TYPE		15	1	Monochrome or color module type
		MONOCHROME=0
		COLOR=1
	MANID			16	8	Manufacturer ID

RDDST				0x09		Read 32-bit display status
	TEARING			9	1	Tearing-effect output enabled
	DISPLAY_ON		10	1	Display output enabled
	ALL_OFF			11	1	All-pixels-off mode active
	ALL_ON			12	1	All-pixels-on mode active
	INVERSION		13	1	Display inversion active
	SCROLL			15	1	Vertical scrolling active
	NORMAL_DISPLAY	16	1	Normal-display mode active
	SLEEP_OUT		17	1	Sleep-out state active
	PARTIAL			18	1	Partial-display mode active
	IDLE			19	1	Idle mode active
	PIXEL_FORMAT	20	3	Interface pixel format
	RGB				26	1	BGR order active
	LAO				27	1	Bottom-to-top line order active
	V				28	1	Vertical RAM writes active
	MX				29	1	Horizontal mirroring active
	MY				30	1	Vertical mirroring active
	BOOSTER_READY	31	1	Booster enabled and ready

SLPIN				0x10		Enter sleep mode

SLPOUT				0x11		Leave sleep mode

PTLON				0x12		Enable partial-display mode

NORON				0x13		Enable normal-display mode

INVOFF				0x20		Disable display inversion

INVON				0x21		Enable display inversion

DALO				0x22		Force all pixels off

DAL					0x23		Force all pixels on

SETCON				0x25		Set LCD contrast offset
	VCON			0	7	Two's-complement VLCD offset

DISPOFF				0x28		Disable display output

DISPON				0x29		Enable display output

CASET				0x2A		Set column write range
	XE				0	8	End column from 0 to 131
	XS				8	8	Start column from 0 to 131

PASET				0x2B		Set page write range
	YE				0	8	End page from 0 to 131
	YS				8	8	Start page from 0 to 131

RAMWR				0x2C		Start display RAM write

RGBSET				0x2D		Load the 256-color lookup table

PTLAR				0x30		Set partial-display area
	AREA_END		0	8	Active-area end row
	AREA_START		8	8	Active-area start row

VSCRDEF				0x33		Set vertical-scroll areas
	BOTTOM_FIXED	0	8	Bottom fixed-area height
	SCROLL_AREA		8	8	Scrollable-area height
	TOP_FIXED		16	8	Top fixed-area height

TEOFF				0x34		Disable tearing-effect output

TEON				0x35		Enable tearing-effect output

MADCTL				0x36		Set RAM addressing and color order
	RGB				3	1	Interface color order
		RGB_ORDER=0
		BGR_ORDER=1
	LAO				4	1	Line-address order
		TOP_TO_BOTTOM=0
		BOTTOM_TO_TOP=1
	V				5	1	RAM write direction
		WRITE_X=0
		WRITE_Y=1
	MX				6	1	Horizontal mirroring
		NORMAL=0
		MIRRORED=1
	MY				7	1	Vertical mirroring
		NORMAL=0
		MIRRORED=1

SEP					0x37		Set vertical-scroll entry point
	VALUE			0	8	Scroll entry row

IDMOFF				0x38		Disable 8-color idle mode

IDMON				0x39		Enable 8-color idle mode

COLMOD				0x3A		Set interface pixel format
	P				0	3	Interface pixel format
		PIXEL_8_BIT=2
		PIXEL_12_BIT=3
		PIXEL_16_BIT=5

SETVOP				0xB0		Set the nine-bit VLCD operating point
	VPR_04_00		0	5	VLCD operating-point low bits
	VPR_08_05		8	4	VLCD operating-point high bits

# These controls are encoded in command bit 0 rather than a following data byte.
BRS_NORMAL			0xB4		Use normal bottom-row order

BRS_MIRRORED		0xB5		Mirror bottom rows

TRS_NORMAL			0xB6		Use normal top-row order

TRS_MIRRORED		0xB7		Mirror top rows

FINV_OFF			0xB8		Disable super-frame inversion

FINV_ON				0xB9		Enable super-frame inversion

DOR_NORMAL			0xBA		Use normal display-RAM data order

DOR_SWAPPED			0xBB		Swap display-RAM data MSB and LSB

TCDFE_OFF			0xBC		Use non-segmented frame frequency

TCDFE_ON			0xBD		Use temperature-segmented frame frequency

TCVOPE_OFF			0xBE		Disable temperature-compensated VLCD

TCVOPE_ON			0xBF		Enable temperature-compensated VLCD

EC_INTERNAL			0xC0		Use the internal display oscillator

EC_EXTERNAL			0xC1		Use the external display clock

SETMUL				0xC2		Set voltage-multiplier factor
	S				0	2	Voltage-multiplier factor
		FACTOR_2=0
		FACTOR_3=1
		FACTOR_4=2
		FACTOR_5=3

TCVOPAB				0xC3		Set VLCD temperature slopes A and B
	SLA				0	3	Temperature slope A
	SLB				4	3	Temperature slope B

TCVOPCD				0xC4		Set VLCD temperature slopes C and D
	SLC				0	3	Temperature slope C
	SLD				4	3	Temperature slope D

TCDF				0xC5		Set segmented frame-frequency dividers
	DFD				0	7	Temperature-region D divider
	DFC				8	7	Temperature-region C divider
	DFB				16	7	Temperature-region B divider
	DFA				24	7	Temperature-region A divider

DF8COLOR			0xC6		Set 8-color frame-frequency divider
	DF8				0	7	8-color frame-frequency divider

SETBS				0xC7		Set LCD bias system
	VB				0	4	LCD bias-system ratio

RDTEMP				0xC8		Read measured temperature code
	TD				0	8	Temperature code; T = 0.9375 x TD - 40 C

NLI					0xC9		Set N-line inversion interval
	NLI				0	8	Inversion interval counter

RDID1				0xDA		Read manufacturer ID
	MANID			0	8	Manufacturer ID

RDID2				0xDB		Read module version ID
	VERSION			0	8	Module version ID

RDID3				0xDC		Read module ID
	MODULE_ID		0	8	Module ID

SFD_INTERFACE		0xEE		Use settings written through the interface

SFD_OTP				0xEF		Use OTP-programmed factory settings

CALMODE				0xF0		Enter OTP calibration mode
	CALMM			0	1	Calibration-mode control
	OPE				1	1	OTP programming enable
	ORA				3	3	OTP register address

OTPSHTIN			0xF1		Shift data into OTP registers
	DATA			0	8	Arbitrary-length OTP data byte
