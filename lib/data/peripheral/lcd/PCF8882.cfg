.name pcf8882
.descr PCF8833-compatible 132x176 TFT LCD controller

# Only the PCF8833-compatible high-level command subset is described.

NOP					0x00		No operation

SWRESET				0x01		Software reset

RDDIDIF				0x04		Read 24-bit display identification
	MODULE_CODE		0	8	Driver or module code
	VERSION			8	7	Driver or module version ID
	MODULE_TYPE		15	1	Monochrome or color module type
		MONOCHROME=0
		COLOR=1
	MANID			16	8	Manufacturer ID

RDDST				0x09		Read 32-bit display status
	TEARING			9	1	Tearing-effect output enabled
	DISPLAY_ON		10	1	Display output enabled
	ALL_OFF			11	1	All-pixels-off mode active
	ALL_ON			12	1	All-pixels-on mode active
	INVERSION		13	1	Display inversion active
	SCROLL			15	1	Vertical scrolling active
	NORMAL_DISPLAY	16	1	Normal-display mode active
	SLEEP_OUT		17	1	Sleep-out state active
	PARTIAL			18	1	Partial-display mode active
	IDLE			19	1	Idle mode active
	PIXEL_FORMAT	20	3	Interface pixel format
	RGB				26	1	BGR order active
	LAO				27	1	Bottom-to-top line order active
	V				28	1	Vertical RAM writes active
	MX				29	1	Horizontal mirroring active
	MY				30	1	Vertical mirroring active

SLPIN				0x10		Enter sleep mode

SLPOUT				0x11		Leave sleep mode

PTLON				0x12		Enable partial-display mode

NORON				0x13		Enable normal-display mode

INVOFF				0x20		Disable display inversion

INVON				0x21		Enable display inversion

DALO				0x22		Force all pixels off

DAL					0x23		Force all pixels on

GAMSET				0x26		Select gamma curve

DISPOFF				0x28		Disable display output

DISPON				0x29		Enable display output

CASET				0x2A		Set column write range
	XE				0	8	End column from 0 to 131
	XS				8	8	Start column from 0 to 131

PASET				0x2B		Set page write range
	YE				0	8	End page from 0 to 175
	YS				8	8	Start page from 0 to 175

RAMWR				0x2C		Start display RAM write

RGBSET				0x2D		Load the 256-color lookup table

PTLAR				0x30		Set partial-display area
	AREA_END		0	8	Active-area end row
	AREA_START		8	8	Active-area start row

VSCRDEF				0x33		Set vertical-scroll areas
	BOTTOM_FIXED	0	8	Bottom fixed-area height
	SCROLL_AREA		8	8	Scrollable-area height
	TOP_FIXED		16	8	Top fixed-area height

TEOFF				0x34		Disable tearing-effect output

TEON				0x35		Enable tearing-effect output

MADCTL				0x36		Set RAM addressing and color order
	RGB				3	1	Interface color order
		RGB_ORDER=0
		BGR_ORDER=1
	LAO				4	1	Line-address order
		TOP_TO_BOTTOM=0
		BOTTOM_TO_TOP=1
	V				5	1	RAM write direction
		WRITE_X=0
		WRITE_Y=1
	MX				6	1	Horizontal mirroring
		NORMAL=0
		MIRRORED=1
	MY				7	1	Vertical mirroring
		NORMAL=0
		MIRRORED=1

SEP					0x37		Set vertical-scroll entry point
	VALUE			0	8	Scroll entry row

IDMOFF				0x38		Disable reduced-color idle mode

IDMON				0x39		Enable reduced-color idle mode

COLMOD				0x3A		Set interface pixel format
	P				0	3	Interface pixel format
		PIXEL_8_BIT=2
		PIXEL_12_BIT=3
		PIXEL_16_BIT=5

RDID1				0xDA		Read manufacturer ID
	MANID			0	8	Manufacturer ID

RDID2				0xDB		Read module version ID
	VERSION			0	8	Module version ID

RDID3				0xDC		Read module ID
	MODULE_ID		0	8	Module ID
