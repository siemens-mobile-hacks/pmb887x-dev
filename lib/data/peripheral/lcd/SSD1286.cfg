.name ssd1286
.descr Solomon Systech SSD1286 TFT LCD controller

OSCILLATION			0x00		Oscillator control and device code read
	OSCEN		0	1	Internal oscillator enable

DRIVER_OUTPUT_CONTROL	0x01	LCD source and gate output configuration
	REV			13	1	Grayscale polarity reversal
	CAD			12	1	TFT storage capacitor configuration
	BGR			11	1	Source RGB component order
	SM			10	1	Gate scan sequence
	TB			9	1	Gate output shift direction
	RL			8	1	Source output shift direction
	MUX			0	8	LCD drive line count minus one

LCD_DRIVE_AC_CONTROL	0x02	LCD inversion and write synchronization control
	FLD			11	1	Three-field interlace enable
	ENWS		10	1	WSYNC output enable
	B_C			9	1	Frame or N-line inversion selection
	EOR			8	1	Frame and N-line inversion XOR enable
	WSMD		7	1	WSYNC output mode
	NW			0	7	N-line inversion interval minus one

ENTRY_MODE			0x03		Display source, color format, and GRAM access mode
	VSMODE		15	1	VSYNC-controlled frame frequency enable
	DFM			13	2	Display color depth
	TRANS		12	1	Generic-input transparency enable
	OEDEF		11	1	OE-defined display window enable
	WMODE		10	1	GRAM write data source
	DMODE		8	2	Display data source
	TY			6	2	262k-color 16-bit write format
	ID			4	2	Horizontal and vertical address directions
	AM			3	1	Address counter update axis
	LG			0	3	GRAM compare operation

COMPARE_1			0x04		Red and green GRAM compare values
	CPR			10	6	Red compare value
	CPG			2	6	Green compare value

COMPARE_2			0x05		Blue GRAM compare value
	CPB			2	6	Blue compare value

DISPLAY_CONTROL		0x07		Display, scrolling, split-screen, and gate control
	PT			11	2	Partial-display inactive-source level
	VLE			9	2	Per-screen vertical scroll enable
	SPT			8	1	Second-screen drive enable
	GON			5	1	Gate-off output level
	DTE			4	1	Display timing enable
	CM			3	1	Eight-color display mode enable
	D			0	2	Display operating state

FRAME_CYCLE_CONTROL	0x0B		LCD line timing and internal clock control
	NO			14	2	Gate-output non-overlap period
	SDT			12	2	Gate-to-source output delay
	EQ			10	2	Equalizing period
	DIV			8	2	Internal clock division ratio
	SDIV		5	1	Manual clock divider enable
	SRTN		4	1	Manual line-clock count enable
	RTN			0	4	Line clock count minus sixteen

POWER_CONTROL_1		0x10		Step-up circuits, op-amp power, and sleep control
	DCY			12	3	High-voltage step-up cycle
	BTH			9	3	VGH step-up output level
	BTL			6	3	VgoffL step-up output level
	DC			4	2	VCIX2 step-up cycle
	AP			1	3	Operational-amplifier drive current
	SLP			0	1	Sleep mode enable

POWER_CONTROL_2		0x11		VGH multiplier and VCIX2 voltage control
	PU			3	2	VGH-to-VCI multiplication ratio
	VRC			0	3	VCIX2 output voltage

POWER_CONTROL_3		0x12		VLCD63 voltage control
	VRH			0	4	VLCD63 voltage amplification

POWER_CONTROL_4		0x13		VCOM low-level generator control
	VCOMG		13	1	VCOM low-level generator enable
	VDV			8	5	VCOM alternating amplitude

HORIZONTAL_PORCH	0x16		External-interface line width and back porch
	XL			8	8	Valid pixels per line
	HBP			0	6	Horizontal back porch clocks minus one

VERTICAL_PORCH		0x17		External-interface vertical front and back porches
	VFP			8	7	Vertical front porch lines minus one
	VBP			0	7	Vertical back porch lines minus one

POWER_CONTROL_5		0x1E		VCOM high-level source and voltage control
	NOTP		7	1	Use software VCOM high-level setting
	VCM			0	6	VCOM high-level voltage ratio

RAM_ADDRESS			0x21		GRAM address counter initialization
	AD			0	16	Initial GRAM address

GRAM_DATA			0x22		GRAM pixel data access
	DATA		0	18	Interface-mapped 18-bit pixel data

RAM_WRITE_MASK_1	0x23		Red and green GRAM write masks
	WMR			10	6	Red channel write mask
	WMG			2	6	Green channel write mask

RAM_WRITE_MASK_2	0x24		Blue GRAM write mask
	WMB			2	6	Blue channel write mask

VCOM_OTP_1			0x28		VCOM OTP command register 1
	VALUE		0	16	VCOM OTP command value

VCOM_OTP_2			0x29		VCOM OTP command register 2
	VALUE		0	16	VCOM OTP command value

GAMMA_1				0x30		Positive gamma micro-adjustments 0 and 1
	PKP0		0	3	Positive gamma micro-adjustment 0
	PKP1		8	3	Positive gamma micro-adjustment 1

GAMMA_2				0x31		Positive gamma micro-adjustments 2 and 3
	PKP2		0	3	Positive gamma micro-adjustment 2
	PKP3		8	3	Positive gamma micro-adjustment 3

GAMMA_3				0x32		Positive gamma micro-adjustments 4 and 5
	PKP4		0	3	Positive gamma micro-adjustment 4
	PKP5		8	3	Positive gamma micro-adjustment 5

GAMMA_4				0x33		Positive gamma gradient adjustments 0 and 1
	PRP0		0	3	Positive gamma gradient adjustment 0
	PRP1		8	3	Positive gamma gradient adjustment 1

GAMMA_5				0x34		Negative gamma micro-adjustments 0 and 1
	PKN0		0	3	Negative gamma micro-adjustment 0
	PKN1		8	3	Negative gamma micro-adjustment 1

GAMMA_6				0x35		Negative gamma micro-adjustments 2 and 3
	PKN2		0	3	Negative gamma micro-adjustment 2
	PKN3		8	3	Negative gamma micro-adjustment 3

GAMMA_7				0x36		Negative gamma micro-adjustments 4 and 5
	PKN4		0	3	Negative gamma micro-adjustment 4
	PKN5		8	3	Negative gamma micro-adjustment 5

GAMMA_8				0x37		Negative gamma gradient adjustments 0 and 1
	PRN0		0	3	Negative gamma gradient adjustment 0
	PRN1		8	3	Negative gamma gradient adjustment 1

GAMMA_9				0x3A		Positive gamma amplification adjustment
	VRP_03_00	0	4	Positive amplification low bits
	VRP_14_10	8	5	Positive amplification high bits

GAMMA_10			0x3B		Negative gamma amplification adjustment
	VRN_03_00	0	4	Negative amplification low bits
	VRN_14_10	8	5	Negative amplification high bits

GATE_SCAN_START		0x40		Gate driver scan starting position
	SCN			0	8	Gate scan start line from 0 to 131

VERTICAL_SCROLL		0x41		First- and second-screen vertical scroll offsets
	VL1			0	8	First-screen vertical scroll offset
	VL2			8	8	Second-screen vertical scroll offset

FIRST_DISPLAY_DRIVE	0x42		First-screen gate drive range
	SS1			0	8	First-screen gate start minus one
	SE1			8	8	First-screen gate end minus one

SECOND_DISPLAY_DRIVE	0x43	Second-screen gate drive range
	SS2			0	8	Second-screen gate start minus one
	SE2			8	8	Second-screen gate end minus one

HORIZONTAL_RAM_ADDRESS	0x44	Horizontal GRAM access window
	HSA			0	8	Horizontal window start address
	HEA			8	8	Horizontal window end address

VERTICAL_RAM_ADDRESS	0x45	Vertical GRAM access window
	VSA			0	8	Vertical window start address
	VEA			8	8	Vertical window end address
