.name siemens_keypad_expander
.descr Siemens keypad expander: a COP8TAC5XLQ8 MCU running a Siemens mask ROM (SK65 D3401)
.addr 0x51
.qemu_dir hw/input/siemens-keypad-expander

# No datasheet describes the mask ROM. The names follow the SK65 firmware driver, which only reads:
# it sends the register address and reads the data after a repeated start.

EVENTS				0x20		Key event queue, 16 bytes terminated by a zero byte
	PRESSED			7	1	Event kind
		RELEASED=0
		PRESSED=1
	CODE			0	7	Key code: ((PX_IN + 2) & 7) << 4 | (PX_OUT + 1), PX_OUT + 1 = 9 for a key to GND

STATUS				0xD0		Expander status
	EVENTS			0	1	Key events are queued
		EMPTY=0
		PENDING=1

REG_F0				0xF0		Read by the firmware when it resynchronizes the key state
