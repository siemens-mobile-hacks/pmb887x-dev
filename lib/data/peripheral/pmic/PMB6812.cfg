.name pmb6812
.descr Infineon PMB6812 SM-POWER power-management IC
.addr 0x08

# Register layout is taken from the PMB6814 V1.0 E-POWERlite data sheet.
# Section 2.3.3 states that it is register-compatible with PMB6812 SM-POWER V1.5.
# PMB6812-only LRF3EN is omitted because PMB6814 does not specify its bit position.
# PMB6812 names register 0x0C USBCTRL; its fields are not documented by PMB6814.

RESCTRL				0x01		Reset and shutdown control
	RESDN			7	1	Generate external reset during power-down
	ALLOFF			6	1	Shut down all regulators except LRTC
	RES				0	1	Trigger internal and external reset

PWCTRL1				0x02		LINT, LANA, LBB1, and LBB2 control
	LINTMD			4	1	LINT operating mode
		STANDBY=0
		ON=1
	LBBV			3	1	LBB1 and LBB2 voltage
		1V5=0
		1V65=1
	LBBMD			1	2	LBB1 and LBB2 operating mode
		OFF=0
		LBB1_VCXO_LBB2_ON=1
		LBB1_OFF_LBB2_ON=2
		ON=3
	LANAMD			0	1	Enable LANA

PWCTRL2				0x03		SDBB converter control
	SDBBMD			6	2	SDBB operating mode
		FORCED_PWM=0
		AUTO_PFM=1
		TEST=2
		FORCED_PFM=3
	ASPWM			5	1	Enable automatic switchback to PWM
	LPEN			4	1	Enable PFM low-power mode
	VSEL			0	2	SDBB output voltage
		1V5=0
		1V8=1
		TEST=2
		1V92=3

CHCTRL1				0x04		Charger mode, voltage, and pulse length
	ON				7	1	Enable charger
	PCH				6	1	Charging mode
		CONTINUOUS=0
		PULSE=1
	VMAX			4	2	Maximum charging voltage
		VCHMAX1=0
		VCHMAX2=1
		RESERVED=2
		VCHMAX3=3
	VL				3	1	Pulse-mode voltage-limit handling
		SHUTDOWN=0
		VOLTAGE_LIMIT=1
	PL				0	3	Charging pulse length
		2MS=0
		4MS=1
		8MS=2
		16MS=3
		33MS=4
		66MS=5
		131MS=6
		262MS=7

INTCTRL1			0x05		Charger and regulator interrupt control
	EICHV			7	1	Interrupt when charging-voltage availability changes
	EICHMD			6	1	Interrupt when charging mode changes
	EICHCAL			5	1	Interrupt when charging-current limit state changes
	EISPWM			3	1	Interrupt on automatic switchback to PWM
	EIORLMMC		2	1	Interrupt when LMMC regulation state changes
	EIORLSIM		1	1	Interrupt when LSIM regulation state changes
	INTMD			0	1	INTOUT interrupt edge
		FALLING=0
		RISING=1

INTCTRL2			0x06		Temperature and power-button interrupt control
	EIOTW			7	1	Interrupt when overtemperature-warning state changes
	RAGOTW			6	1	Reduce audio gain on overtemperature warning
	OTSEN			4	1	Enable overtemperature shutdown
	EION			1	1	Interrupt when ON pin level changes
	DEBUG			0	1	Error-flag reporting mode
		CURRENT=0
		LATCHED=1

PWCTRL3				0x07		LRF2 regulator control
	LRF2V			2	1	LRF2 output voltage
		2V7=0
		2V5=1
	LRF2MD			0	2	LRF2 operating mode
		OFF=0
		VCXO=1
		FORCED_OFF=2
		ON=3

CHCTRL2				0x08		Charger current control
	RVM				5	3	Charging-current measurement reference
		0MA=0
		100MA=1
		200MA=2
		300MA=3
		400MA=4
		500MA=5
		600MA=6
		700MA=7
	PREOFF			4	1	Disable precharging
	CHCLIM			0	3	Battery charging-current limit
		400MA=0
		500MA=1
		600MA=2
		700MA=3
		800MA=4
		900MA=5
		1000MA=6
		1100MA=7

LEDCTRL1			0x0A		Main LED driver control
	LEDPWM			1	6	LED PWM duty-cycle code from 0 to 63
	LEDON			0	1	Enable main LED driver

DRVCTRL				0x0B		Vibrator driver control
	VVIB			0	4	Vibrator voltage code from 0.9 V to 2.0 V

USBCTRL				0x0C		USB control
	VALUE			0	8	Raw PMB6812 USB control value

AUDCTRL				0x0D		Audio amplifier control
	TRISTATE		4	1	Make audio output high-impedance while powered down
	AUDGAIN			2	2	Audio amplifier gain
		MINUS_6DB=0
		MINUS_1_2DB=1
		PLUS_2_7DB=2
		PLUS_7_6DB=3
	MUTE			1	1	Mute audio amplifier
	AUDON			0	1	Enable audio amplifier

PWCTRL4				0x0E		LRFC and LRF1 regulator control
	LRFCMD			6	2	LRFC operating mode
		OFF=0
		VCXO=1
		FORCED_OFF=2
		ON=3
	LRF1MD			2	2	LRF1 operating mode
		OFF=0
		VCXO=1
		FORCED_OFF=2
		ON=3

PWCTRL5				0x11		LSIM and LSIM2 regulator control
	LSIM2V			6	1	LSIM2 output voltage
		2V85=0
		1V8=1
	LSIM2MD			3	3	LSIM2 operating mode
		OFF=0
		VCXO_STANDBY=1
		ON=2
		VCXO_STANDBY_ALT=3
		STANDBY=4
		ON_ALT1=5
		OFF_ALT=6
		ON_ALT2=7
	LSIMV			2	1	LSIM output voltage
		2V85=0
		1V8=1
	LSIMMD			0	2	LSIM operating mode
		OFF=0
		VCXO_STANDBY=1
		STANDBY=2
		ON=3

PWCTRL6				0x12		LMMC regulator control
	LMMCV			2	1	LMMC output voltage
		1V8=0
		2V85=1
	LMMCMD			0	2	LMMC operating mode
		OFF=0
		VCXO_STANDBY=1
		STANDBY=2
		ON=3

LEDCTRL2			0x13		Secondary LED and current control
	SLED2ON			7	1	Enable secondary LED driver 2
	SLED1ON			6	1	Enable secondary LED driver 1
	LEDCUR			3	3	Main LED current
		POWER_DOWN=0
		20MA=1
		40MA=2
		60MA=3
		80MA=4
		100MA=5
		120MA=6
		140MA=7

GEF1				0x80		First general error flags
	LRFC			4	1	LRFC current limit exceeded
	LRF1			3	1	LRF1 current limit exceeded
	LRF2			2	1	LRF2 current limit exceeded
	LANA			1	1	LANA current limit exceeded
	LINT			0	1	LINT current limit exceeded

ISF					0x81		Interrupt source flags
	OTW				7	1	Overtemperature warning
	LMMC			4	1	LMMC out of regulation
	LSIM			3	1	LSIM out of regulation
	SPWM			2	1	Automatic switchback from PFM to PWM occurred
	OTS				1	1	Overtemperature shutdown caused reset
	LON				0	1	ON pin level changed

CHST				0x82		Charger status and PMIC identification
	CHV				7	1	Charging voltage is available
	CHMD			6	1	Charger is current-limited
	CCAL			5	1	Charging current exceeds the programmed limit
	PMUID			0	1	Power-management IC family
		SM_POWER=0
		E_POWERLITE=1

GEF2				0x83		Second general error flags
	OTWD			7	1	Overtemperature warning in debug mode
	LSIM2			3	1	LSIM2 current limit exceeded
	LBB2			2	1	LBB2 current limit exceeded
	LBB1			1	1	LBB1 current limit exceeded
	SDBB			0	1	SDBB current limit exceeded
