.name d1094ec
.descr Dialog D1094EC, CX75/M75 Power ASIC
.addr 0x31

# Register names and light-channel routing confirmed against the CX75 firmware and hardware.
# The original CX75 initialization writes 0x09 to SUPPLY_ENABLE_2 and 0x20 to
# DCDC_STEPUP_CONTROL. The hardware test additionally enables VBOOST and selects
# DCDC step-up mode 0x28.

IDENTIFICATION_STATUS	0x00
	# Firmware identifies the model with VALUE & 0x87; bits 6:3 are separate status/revision data.
	MODEL_LOW	0	3
	STATUS_REVISION	3	4
	MODEL_HIGH	7	1

FAULT				0x01
	THERMAL_SHUTDOWN	3	1
	UNDERVOLTAGE_AUDIO_REGA	5	1

TURNOFF_REASON		0x05
	VALUE		0	8
		UNDEFINED=0
		NO_REASON_STORED=1
		UNDERVOLTAGE_VBATT=2
		UNDERVOLTAGE_REG_3=3
		UNDERVOLTAGE_REG_2A=4
		UNDERVOLTAGE_REG_1=5
		SHUTDOWN_BY_REGISTER=6
		WATCHDOG_MIN_TIME=7
		WATCHDOG_MAX_TIME=8
		OVERVOLTAGE_VBATT=9

SUPPLY_ENABLE_1		0x06
	VALUE		0	8

SUPPLY_ENABLE_2		0x07
	VBOOST_EN	2	1

POWER				0x0E
	WDT_TIME	0	2
		3S=0
		6S=1
		12S=2
		24S=3
	POWEROFF	2	1

DCDC_STEPUP_CONTROL	0x10
	VALUE		0	8

LED1_PWM			0x12
	VALUE		0	8

LED2_PWM			0x13
	VALUE		0	8

LIGHT_CONTROL		0x14
	# The output gates are ordered LED2, LED1, while the PWM gates are LED1, LED2.
	LED2_OUTPUT_EN	1	1
	LED1_OUTPUT_EN	2	1
	LED1_PWM_EN	3	1
	LED2_PWM_EN	4	1
	LED_MASTER_EN	5	1

TONE_CTRL			0x42
	PLAY		4	1

TONE_VOLUME		0x44
	LEVEL		0	8

TONE_FREQ			0x46
	LEVEL		0	8

VIBRA				0x47
	LEVEL		0	8

AUDIO_VOLUME		0x50
	LEVEL		0	8

RF_REG				0x58
	EN_VRF1		0	1
	EN_VRF2		1	1
	EN_VRF3		2	1
