.name d1094xx
.descr Dialog D1094xx Mozart Power ASIC family
.addr 0x31

# Register functions reconstructed from firmware and PMIC reset dumps.
# Audio command names are taken from the emulator's routing-command table.
# Undocumented or ambiguous bits are intentionally omitted.
# Firmware model signatures: 0x84, 0x04, 0x85, and 0x05.
# VLPREG uses SUPPLY_ENABLE_2 on legacy revisions and SWITCH_MUX_2 otherwise.

IDENTIFICATION		0x00		Device identification and revision
	MODEL			0	3	Base model code
	REVISION		3	4	Hardware revision code
	VENDOR			7	1	Silicon vendor: 0 is ST Twigo4, 1 is Dialog Mozart
		ST=0
		DIALOG=1

IRQ_STATUS_1		0x01		First interrupt-status byte
	OVER_TEMP		2	1	PMIC overtemperature
	CHARGER_EVENT	3	1	Charger status event
	UV_AUDIO_REGA	5	1	Audio regulator A undervoltage

IRQ_STATUS_2		0x02		Second interrupt-status byte
	UV_SIM_REGA		0	1	SIM regulator A undervoltage
	SUPPLY_SHORT	1	1	Supply short circuit
	UNEXP_CHARGE	2	1	Unexpected charging
	VBATT_OV		5	1	Battery overvoltage

IRQ_MASK_1			0x03		First interrupt-mask byte
	VALUE			0	8	Interrupt mask bits

IRQ_MASK_2			0x04		Second interrupt-mask byte
	VALUE			0	8	Interrupt mask bits

TURNOFF_REASON		0x05		Stored shutdown reason
	VALUE			0	8	Shutdown reason code
		UNDEFINED=0
		NO_REASON_STORED=1
		UNDERVOLTAGE_VBATT=2
		UNDERVOLTAGE_REG3=3
		UNDERVOLTAGE_REG2A=4
		UNDERVOLTAGE_REG1=5
		SHUTDOWN_BY_REGISTER=6
		WATCHDOG_MIN_TIME=7
		WATCHDOG_MAX_TIME=8
		OVERVOLTAGE_VBATT=9

SUPPLY_ENABLE_1		0x06		Primary regulator enables
	VREG1_EN		0	1	Enable regulator VREG1
	VREG2B_EN		1	1	Enable regulator VREG2B
	VSIMREGA_EN		2	1	Enable SIM regulator A
	VSIMREGB_EN		3	1	Enable SIM regulator B
	VAUDREGA_EN		4	1	Enable audio regulator A
	VAUDREGB_EN		5	1	Enable audio regulator B
	VREGMEM1_EN		6	1	Enable memory regulator 1
	VREGMEM2_EN		7	1	Enable memory regulator 2

SUPPLY_ENABLE_2		0x07		Auxiliary regulator enables
	VIBRA_EN		0	1	Enable vibra supply
	VREGUSB_EN		1	1	Enable USB regulator
	VBOOST_EN		2	1	Enable VBOOST supply
	VLPREG_EN		4	1	Enable low-power regulator on legacy revisions

RF_ENABLE			0x08		RF regulator enables
	VRF1_EN			0	1	Enable RF regulator 1
	VRF2_EN			1	1	Enable RF regulator 2
	VRF3_EN			2	1	Enable RF regulator 3

SUPPLY_CONTROL_1	0x09		Primary regulator modes and levels
	VREG1_MODE		0	1	VREG1 operating mode
	VREG2_LEVEL		1	3	VREG2A and VREG2B voltage level
	VREG3_LEVEL		4	3	VREG3 voltage level
	STEPDOWN_MODE	7	1	Buck-converter operating mode

SUPPLY_MODE			0x0A		Regulator operating modes
	VSIMREGA_MODE	0	1	SIM regulator A mode
	VAUDREGA_MODE	1	1	Audio regulator A mode
	VAUDREGB_MODE	2	1	Audio regulator B mode

RF_VOLTAGE			0x0B		RF regulator voltage selection
	VRF1_LEVEL		0	2	RF regulator 1 level
		2850MV=2
	VRF2_LEVEL		2	2	RF regulator 2 level
		2850MV=2
	VRF3_LEVEL		4	2	RF regulator 3 level

LIGHT_ENABLE		0x0C		LED channel enables
	LED1_EN			0	1	Enable LED channel 1
	LED2_EN			1	1	Enable LED channel 2
	LED3_EN			2	1	Enable LED channel 3

POWER				0x0E		Watchdog and shutdown control
	WDT_TIME		0	2	Watchdog timeout
		3S=0
		6S=1
		12S=2
		24S=3
	POWEROFF		2	1	Request system shutdown

CHARGE_CONTROL		0x10		Battery-charger control
	CURRENT			0	2	Charge current
		75MA=0
		150MA=1
		300MA=2
		400MA=3
	CHARGE_EN		3	1	Enable battery charging
	CURRENT_EN		7	1	Enable programmed charge current

CHARGE_STATUS		0x11		Charge-current measurement
	CURRENT			0	8	Raw current; firmware maps <0x1F to 0, otherwise ((value >> 5) + 1) x 200 mA

LIGHT_PWM1			0x12		Light PWM channel 1 level
	LEVEL			0	7	PWM level from 0 to 80

LIGHT_PWM2			0x13		Light PWM channel 2 level
	LEVEL			0	7	PWM level from 0 to 80

LIGHT_CONTROL		0x14		LED outputs and PWM control
	LED1_EN			1	1	Enable LED output 1
	LED2_EN			2	1	Enable LED output 2
	PWM1_EN			3	1	Enable light PWM channel 1
	PWM2_EN			4	1	Enable light PWM channel 2
	MASTER_EN		5	1	Enable LIGHT block

DDPS_CONTROL		0x20		Dynamic-power-supply control
	VALUE			0	8	Raw control value

AMPLIFIER_GAIN_0	0x40		Amplifier path 0 gain
	LEVEL			0	8	Gain code

AMPLIFIER_GAIN_1	0x41		Amplifier path 1 gain
	LEVEL			0	8	Gain code

MONO_CONTROL		0x42		Mono audio-path control
	KEY_CLICK_EN	3	1	Enable key-click generator

STEREO_CONTROL		0x43		Stereo audio-path control
	VALUE			0	8	Stereo control bits

AMPLIFIER_GAIN_2	0x44		Amplifier path 2 and tone level
	GAIN			0	6	Amplifier gain code
	TONE_LEVEL		6	2	Key-click and ringing tone level

AMPLIFIER_GAIN_3	0x45		Amplifier path 3 gain
	LEVEL			0	8	Gain code

TONE_CONTROL		0x46		Key-click and ringing tone generator control
	DURATION		0	5	Key-click duration code
	MODULATION		5	2	Tone modulation mode

VIBRA				0x47		Vibra drive level
	LEVEL			0	8	Drive level code

PP_AMPLIFIER_1		0x48		First push-pull amplifier route
	PATH_1_SOURCE	0	3	First path source
	PATH_1_EN		3	1	Enable first path
	PATH_2_SOURCE	4	3	Second path source
	PATH_2_EN		7	1	Enable second path

SWITCH_MUX_1		0x49		Audio switch-mux path 1
	VALUE			0	8	Mux control value

PP_ROUTE_1			0x4A		First push-pull route selection
	VALUE			0	4	Route selection from 0 to 8

ADC_CONTROL			0x4B		Audio ADC control
	VALUE			0	8	ADC control bits

PP_AMPLIFIER_2		0x4C		Second push-pull amplifier route
	PATH_1_SOURCE	0	3	First path source
	PATH_1_EN		3	1	Enable first path
	PATH_2_SOURCE	4	3	Second path source
	PATH_2_EN		7	1	Enable second path

SWITCH_MUX_2		0x4D		Audio switch-mux path 2
	VALUE			0	6	Mux control value
	VLPREG_EN		6	1	Enable low-power regulator on later revisions

PP_ROUTE_2			0x4E		Second push-pull route selection
	VALUE			0	4	Route selection from 0 to 8

SWITCH_MUX_4		0x4F		Audio switch-mux path 4
	VALUE			0	8	Mux control value

AMPLIFIER_GAIN_4_5	0x50		Amplifier paths 4 and 5 gain
	GAIN			0	7	Amplifier gain code
	PATH_4_SELECT	7	1	Select amplifier path 4

AMPLIFIER_GAIN_6	0x51		Amplifier path 6 gain
	LEVEL			0	8	Gain code

DAC_CONTROL			0x52		Audio DAC control
	VALUE			0	8	DAC control bits

AMPLIFIER_GAIN_7_8	0x53		Amplifier paths 7 and 8 gain
	GAIN			0	7	Amplifier gain code
	PATH_7_SELECT	7	1	Select amplifier path 7

AMPLIFIER_GAIN_9	0x54		Amplifier path 9 gain
	GAIN			0	7	Amplifier gain code

SWITCH_MUX_5		0x55		Audio switch-mux path 5
	VALUE			0	8	Mux control value

MUX_INPUT			0x56		Audio mux-input selection
	VALUE			0	8	Mux input code

SWITCH_MUX_3		0x57		Audio switch-mux path 3
	VALUE			0	8	Mux control value

OUTPORT_CONTROL		0x58		OUTPORT control
	MODE			0	2	OUTPORT operating mode
	LEVEL			2	1	OUTPORT output level

SAMPLE_RATE			0x59		Audio ADC and DAC sample rates
	ADC				0	4	ADC sample-rate code from 0 to 8
	DAC				4	4	DAC sample-rate code from 0 to 8

STEREO_MODE			0x5A		Stereo audio operating mode
	VALUE			0	8	Stereo mode code

I2S_RX_CONTROL		0x5B		I2S receive-path control
	VALUE			0	8	Receive control bits

I2S_TX_CONTROL		0x5C		I2S transmit-path control
	VALUE			0	8	Transmit control bits

AUDIO_CONTROL_2		0x5D		Additional audio-path control
	VALUE			0	8	Raw control value
