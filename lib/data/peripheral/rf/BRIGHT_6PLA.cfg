.name bright_6pla
.descr Renesas Bright 6PLA GSM/EDGE RF transceiver
.qemu_dir hw/gsm/bright-6pla

# The register number is the first nibble of a telegram; the fields below are in the remaining bits.

CONTROL_R0			0x00		Undocumented control register
	DATA		0	20	Raw control data

CHANNEL				0x01		Channel synthesizer configuration
	CONTROL		0	3	Undocumented control bits
	RECEIVE		3	1	Receive path
	FREQUENCY	4	14	Channel frequency in 100 kHz steps in bands 0 and 1, 200 kHz steps in bands 2 and 3
	BAND		18	2	Synthesizer band code

GAIN				0x02		Receiver gain configuration
	LNA			4	2	LNA and mixer gain mode
	PGA			6	6	Baseband amplifier gain in 2 dB steps

CONTROL_R4			0x04		Undocumented control register
	DATA		0	20	Raw control data

CONTROL_R5			0x05		Undocumented control register
	DATA		0	20	Raw control data

CONTROL_R6			0x06		Undocumented control register
	DATA		0	20	Raw control data

CONTROL_R7			0x07		Undocumented control register
	DATA		0	20	Raw control data
