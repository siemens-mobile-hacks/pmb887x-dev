.name hd15515x
.descr Hitachi HD155153NP and HD155155NPEB GSM RF transceivers
.qemu_dir hw/gsm/hd15515x

# Recovered from EL71 (HD155153NP) and CX75 (HD155155NPEB) firmware telegram
# builders, channel tables and TPU event templates. Telegrams are 8, 16 or 24
# bits; the low three bits select the register. The firmware never reads the
# chip. Fields whose meaning is not established remain raw.
# Common register map; chip differences:
# - CHANNEL_PLL.BAND: HD155153NP uses 0 for GSM850 and 1 for GSM900;
#   HD155155NPEB uses 1 for both. 2 is DCS1800 and 3 is PCS1900 on both.
# - GAIN_CONTROL.FRONT_END: HD155153NP firmware writes 3, 2 or 0 from AGC
#   gain code bits 7..6; HD155155NPEB firmware sets bit 0 in the low bands
#   and bit 1 in the high bands, and clears both when AGC gain code bit 7 is set.
# - CONTROL_R3: 24-bit telegram during HD155153NP TX bursts; 8-bit command
#   before TXON on HD155155NPEB.

CHANNEL_PLL			0x01		Channel synthesizer configuration
	BAND		0	2	Synthesizer band code
	DIVIDER		2	14	Synthesizer divider in 200 kHz steps; bit 2 is zero in bands 0 and 1
	RECEIVE		16	1	Receive path
	TX_OFFSET	18	1	Transmit offset below the synthesizer
		OFFSET_80MHZ=0
		OFFSET_82MHZ=1
	MODE		19	2	Operating mode

GAIN_CONTROL			0x02		Receiver gain configuration
	PGA_GAIN	0	6	Programmable-gain amplifier code
	FRONT_END	6	2	Front-end gain stage control
	DATA		8	13	Raw configuration data

CONTROL_R3			0x03		Undocumented control register
	DATA		0	21	Raw control data

CONTROL_R4			0x04		Undocumented 8-bit control register
	DATA		0	5	Raw control data

CONFIG_R5			0x05		Undocumented 24-bit configuration register
	DATA		0	21	Raw configuration data

CALIBRATION_R6			0x06		Calibration and configuration commands
	SLOT		0	3	Command slot
	DATA		3	18	Raw command data

CONTROL_R7			0x07		Undocumented 8-bit control register
	DATA		0	5	Raw control data
