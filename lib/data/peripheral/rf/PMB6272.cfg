.name pmb6272
.descr Infineon PMB6272 SMARTi RF transceiver

# The RF register layout follows the compatible PMB7880 RF register set.
# SL98 firmware telegrams confirm the XO_INIT1, XO_INIT2, XO_INIT3, and XO_TUNE
# register addresses. Undocumented mandatory and reserved bits are left unnamed.

CHANNEL1			0x00		Fractional synthesizer channel word, low part
	FRACTION		4	20	Fractional channel word bits 19..0

CHANNEL2			0x02		Synthesizer channel and operating mode
	FRACTION		4	3	Fractional channel word bits 22..20
	INTEGER			7	8	Integer channel word
	POWER_MODE		15	2	Transceiver power mode
		ALL_OFF=0
		UNUSED=1
		PLL_TEST=2
		ALL_ON=3
	TRX				18	1	Receive or transmit path
		RX=0
		TX=1
	BAND			19	2	RF band
		GSM850=0
		GSM900=1
		DCS1800=2
		PCS1900=3

RXTX				0x04		Receiver gain and burst activation
	RXGAIN			4	2	Receiver gain
		LOW=0
		MEDIUM=1
		UNSUPPORTED=2
		HIGH=3
	RXCORR			6	4	Receiver gain correction
	RXCM			11	2	Mandatory receiver common-mode setting
	RXGS0			13	1	Enable +12 dB receiver gain step
	RXGS1			14	1	Enable +6 dB receiver gain step
	RXGS2			15	1	Enable -6 dB receiver gain step
	RXGS3			16	1	Enable -3 dB receiver gain step
	OFC				17	1	Enable DC-offset compensation

XO_INIT1			0x06		Crystal oscillator mode and calibration
	XOMODE0			4	1	Use an external oscillator signal
	XOMODE1			5	1	Mandatory oscillator-mode bit
	XOMODE3			7	1	Mandatory oscillator-mode bit
	XOSETUP			16	4	Crystal-core capacitance adaptation
	XOCAL			20	3	Crystal subrange selection
	CRYSTAL_SIZE	23	1	Crystal load capacitance
		10PF=0
		8PF=1

XO_INIT3			0x08		Crystal oscillator linearization configuration
	VALUE			4	20	Undocumented configuration value

XO_INIT2			0x0A		Crystal oscillator linearization coefficients
	ALPHA			4	10	LUXO alpha coefficient
	GAMMA			14	10	LUXO gamma coefficient

XO_TUNE				0x0C		Crystal oscillator frequency correction
	AFC				4	17	Frequency-correction value
