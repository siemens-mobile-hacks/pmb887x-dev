.name hd155153np
.descr Hitachi HD155153NP GSM RF transceiver

# Recovered from EL71 firmware telegram builders and channel tables. Fields
# whose meaning is not established remain raw.

CHANNEL_PLL			0x01		Channel synthesizer configuration
	SYNTHESIZER	0	19	Synthesizer channel word
	MODE		19	2	Operating mode

GAIN_CONTROL			0x02		Gain configuration
	PGA_GAIN	0	6	Programmable-gain amplifier step
	MIXER2_LOW_GAIN	6	1	Second mixer low-gain mode
	MIXER1_LOW_GAIN	7	1	First mixer low-gain mode

CONTROL_R4			0x04		Undocumented 8-bit control register
	DATA		0	5	Raw control data

CONFIG_R5			0x05		Undocumented 24-bit configuration register
	DATA		0	21	Raw configuration data

CALIBRATION_R6			0x06		Calibration and configuration commands
	SLOT		0	3	Command slot
	DATA		3	18	Raw command data

CONTROL_R7			0x07		Undocumented 8-bit control register
	DATA		0	5	Raw control data
