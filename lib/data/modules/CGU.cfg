.id 0x1
.type NATIVE
.size 0x200
.name CGU
.qemu pmb887x-cgu
.descr Clock Generation Unit

.irq
.gpio CLK32

OSC					0x0A0	Clock Generation Unit Control Register 1 (CGU_CTL1)
	PLL_POWER_UP		0	1	Power up PLL
	PHASE1_POWER_UP		1	1	Power up phase-shifter output 1
	PHASE2_POWER_UP		2	1	Power up phase-shifter output 2
	PHASE3_POWER_UP		3	1	Power up phase-shifter output 3
	PHASE4_POWER_UP		4	1	Power up phase-shifter output 4
	PLL_BYPASS_N		8	1	Disable PLL bypass
	PHASE1_BYPASS_N		9	1	Disable bypass for phase-shifter output 1
	PHASE2_BYPASS_N		10	1	Disable bypass for phase-shifter output 2
	PHASE3_BYPASS_N		11	1	Disable bypass for phase-shifter output 3
	PHASE4_BYPASS_N		12	1	Disable bypass for phase-shifter output 4
	NDIV				16	6	PLL feedback divider (multiply by N+1)
	MDIV				24	4	PLL input divider (divide by M+1)

CON0				0x0A4	Clock Generation Unit Control Register 3 (CGU_CTL3)
	PHASE1_CONFIG		0	8	Complete K1/K2 configuration byte for phase-shifter output 1
	PHASE2_CONFIG		8	8	Complete K1/K2 configuration byte for phase-shifter output 2
	PHASE3_CONFIG		16	8	Complete K1/K2 configuration byte for phase-shifter output 3
	PHASE4_CONFIG		24	8	Complete K1/K2 configuration byte for phase-shifter output 4

	PHASE1_K2			0	3	Phase 1 divider denominator term, valid values 0..5
	PHASE1_K1			3	4	Phase 1 divider: fPLL * 12 / (K1 * 6 + K2)

	PHASE2_K2			8	3	Phase 2 divider denominator term, valid values 0..5
	PHASE2_K1			11	4	Phase 2 divider: fPLL * 12 / (K1 * 6 + K2)

	PHASE3_K2			16	3	Phase 3 divider denominator term, valid values 0..5
	PHASE3_K1			19	4	Phase 3 divider: fPLL * 12 / (K1 * 6 + K2)

	PHASE4_K2			24	3	Phase 4 divider denominator term, valid values 0..5
	PHASE4_K1			27	4	Phase 4 divider: fPLL * 12 / (K1 * 6 + K2)

CON1				0x0A8	Clock Generation Unit Control Register 4 (CGU_CTL4)
	FPI1_CLKSEL			0	2	Source clock for FPI1
		OSC=0
		CLK32K=1
		PLL_DIV_2=2
		DISABLE=3
	FPI1_CLKDIV			4	2	FPI1 clock divider; bypassed for CLK32K
		DIV1=0
		DIV2=1
		DIV4=2
		DIV8=3

	FSYS_CLKSEL			16	2	Source clock for fSYS (BYPASS: fSYS=fOSC, PLL: fSYS=fPLL / 2)
		BYPASS=0
		PLL=2
		DISABLE=3

	AHB_CLKSEL			20	3	Source clock for fAHB
		BYPASS=0
		DISABLE=1
		PLL=2
		PHASE1=3
		PHASE2=4
		PHASE3=5
		PHASE4=6

	FSTM_DIV_EN			25	1	Enable fSTM divider
	FSTM_DIV			28	2	fSTM divider: divide fOSC by 4 * 2^n
		4=0
		8=1
		16=2
		32=3

CON2				0x0AC	Clock Generation Unit Control Register 5 (CGU_CTL5)
	DSP_CLKSEL			0	3	Source clock for DSP
		PHASE1=3
		DISABLE=7
	EBU_CLKSEL			4	3	Source clock for EBU
		OSC=0
		DISABLE=1
		PLL=2
		PHASE1=3
		PHASE2=4
		PHASE3=5
		PHASE4=6
		AHB=7
	CPU_DIV				8	2	ARM clock divider: divide fAHB by N+1
	CPU_DIV_EN			12	1	Enable ARM clock divider
	AFC32K_EN			13	1	Enable the 32 kHz standby clock for AFC
	CLK48M_CLKSEL		14	2	Source clock for CLK48M
		OSC=0
		PHASE4=2
		DISABLE=3
	CLKOUT0_EN			16	1	Enable CLKOUT0
	CLKOUT0_CLKDIV		17	2	CLKOUT0 divider from the oscillator
		DIV1=0
		DIV2=1
		DIV4=2
		DIV8=3
	CLKOUT1_EN			20	1	Enable CLKOUT1
	CLKOUT1_CLKDIV		21	2	CLKOUT1 divider from the oscillator
		DIV1=0
		DIV2=1
		DIV4=2
		DIV8=3
	CLK32K_EN			24	1	Enable external 32 kHz clock output
	MS_CLKSEL			28	2	Source clock for the mixed-signal domain (CLK_MS_O)
		OSC=0
		CLK32K=1
		OSC_DIV_64=2
		DISABLE=3

STAT				0x0B0	PLL Status Register
	LOCK				13	1	PLL lock status

CON3				0x0B4	Clock Generation Unit Control Register 6 (CGU_CTL6)
	AHB_PER_CLKSEL		0	2	Source clock for AHB_PER
		OSC=0
		CLK32K=1
		PLL_DIV_2=2
		DISABLE=3
	AHB_PER_CLKDIV		4	2	AHB_PER clock divider; bypassed for CLK32K
		DIV1=0
		DIV2=1
		DIV4=2
		DIV8=3
	MMCI_CLKSEL			8	2	Source clock for MMCI
		OSC=0
		CLK32K=1
		PHASE4=2
		DISABLE=3
	MMCI_CLKDIV			12	2	MMCI clock divider
		DIV1=0
		DIV2=1
		DIV4=2
		DIV8=3
	CLKOUT2_EN			16	1	Enable CLKOUT2
	CLKOUT2_CLKDIV		20	2	CLKOUT2 divider from phase 4
		DIV1=0
		DIV2=1
		DIV4=2
		DIV8=3
	CLK48M_CLKDIV		24	2	CLK48M divider
		DIV1=0
		DIV2=1
		DIV4=2
		DIV8=3
	DMA_CLK_DISABLE		28	1	Disable the 104 MHz DMA clock when set

SRC					0x0CC	Service Request Control Register
	*MOD_SRC
