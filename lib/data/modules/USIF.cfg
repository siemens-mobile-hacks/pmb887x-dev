.id 0xF051C012
.type MODULE
.size 0x10000
.name USIF
.qemu pmb887x-usif
.descr Universal Serial Interface (Infineon USIF, used for the Bluetooth HCI transport)

CLC			0x00	Clock Control Register
	*MOD_CLC

RUN			0x10	Run Control Register
	RUN			0	1	Enable USIF
	BUSY		17	1	Module Busy

MODEM_CTRL	0x14	Modem Control Register (DTR/RTS)
	DTR			3	1
	RTS			4	1

PROTO		0x1C	Protocol / Framing Register

MODE		0x20	Mode / Oversampling Register

BAUD		0x28	Baudrate Reload Register

FBAUD		0x2C	Fractional Baudrate Register

RXSMP		0x30	RX Sampling Point Register

MODEM_STAT	0x34	Modem Status Register (CTS/DSR) [read-only]
	CTS			0	1
	DSR			1	1

TPS			0x3C	TX Transfer Count / Pending Size [read-only]

FIFO_STAT	0x40	TX FIFO Status Register [read-only]
	FILL		0	5	TX FIFO fill level
	BUSY		8	1	TX in progress

TX_IMSC		0x84	TX Interrupt Mask Register

RX_IMSC		0x94	RX Interrupt Mask Register

TXD			0x4000	TX FIFO Data Window (also DMA TX endpoint) [write-only]

RXD			0x8000	RX FIFO Data Window (also DMA RX endpoint) [read-only]
