.id 0xF051C012
.type MODULE
.size 0x100000
.name USIF
.qemu pmb887x-usif
.descr Universal Serial Interface

.irq	RX_SINGLE
.irq	RX_BURST
.irq	TX
.irq	AB
.irq	ERR
.irq	PIRQ

CLC					0x00	Clock Control Register
	*MOD_CLC

ID					0x08	Identification Register
	*MOD_ID

RUNCTRL				0x10	Run Control Register
	RUN			0	1	Run the interface; clearing flushes both FIFOs

MSS_SET				0x14	Modem Status Set Register
	FCO			0	1	Assert the flow-control (RTS) output
	DSR			3	1	Assert the DSR output
	DCD			4	1	Assert the DCD output
	RI			5	1	Assert the RI output

MSS_CLR				0x18	Modem Status Clear Register
	FCO			0	1	Deassert the flow-control (RTS) output
	DSR			3	1	Deassert the DSR output
	DCD			4	1	Deassert the DCD output
	RI			5	1	Deassert the RI output

MODE_CFG			0x1C	Mode Configuration Register (writable only while stopped)
	SYNC		0	1	Synchronous (SPI) mode
	MA			1	1	Master mode
	RXEN		2	1	Enable the receiver
	LB			4	1	Loop the transmitter back to the receiver
	ECH			5	1	Echo received data to the transmitter
	TXINV		6	1	Invert the TX line
	RXINV		7	1	Invert the RX line
	SCFRC		8	1	Force the shift clock
	SCPOL		9	1	Shift clock polarity
	SCPH		10	1	Shift clock phase
	TXIDLE		11	1	TX line level while idle
	ABEN		12	1	Enable autobaud detection
	EQU			14	1	Equalize received bits

PRTC_CFG			0x20	Protocol Configuration Register (writable only while stopped)
	CLEN		0	5	Character length in bits
	HD			7	1	Half-duplex mode
	PAR			8	1	Enable parity
	ODD			9	1	Odd parity
	ERRFE		10	1	Report framing errors
	STP2		12	1	Two stop bits
	RESWKUP		13	1	Restart reception on wake-up
	FCIEN		16	1	Hold transmission while the CTS input is inactive
	FCOEN		17	1	Drive RTS from the RX FIFO level
	FCIINV		18	1	Invert the CTS input
	FCOTL		20	6	RX FIFO level that deasserts RTS
	SLIPEN		28	1	Enable SLIP framing

BC_CFG				0x28	Baud Rate Counter Register (writable only while stopped)
	BCRV		0	13	Bit time = 16 * (BCRV + 1) fractional-divider clocks

FDIV_CFG			0x2C	Fractional Divider Register (writable only while stopped)
	INC			0	9	Increment of the fractional divider
	DEC			16	16	Decrement of the fractional divider

ICTMO_CFG			0x30	RX Inter-Character Timeout Register (writable only while stopped)
	TMO			0	16	Idle time that ends a received packet

MSS_STAT			0x34	Modem Status Register
	FCO			0	1	Flow-control (RTS) output state
	FCI			1	1	Flow-control (CTS) input state after FCIINV

TXFIFO_CFG			0x38	TX FIFO Configuration Register (writable only while stopped)
	TXBS		0	2	TX burst size
		1_WORD=0
		2_WORD=1
		4_WORD=2
	TXFA		8	2	Characters per TX FIFO word
		1=0
		2=1
		4=2
	TXFC		16	1	TX FIFO controls the transfer flow

TPS_CTRL			0x3C	Transmit Packet Size Register
	TPS			0	14	Characters in the next TX packet

TXFIFO_STAT			0x40	TX FIFO Status Register
	TXFFS		0	5	Filled TX FIFO stages
	TXBUSY		8	1	Transmitter is shifting a character

RXFIFO_CFG			0x44	RX FIFO Configuration Register (writable only while stopped)
	RXBS		0	2	RX burst size
		1_WORD=0
		2_WORD=1
		4_WORD=2
	RXFA		8	2	Characters per RX FIFO word
		1=0
		2=1
		4=2
	RXFC		16	1	RX FIFO controls the transfer flow

MRPS_CTRL			0x48	Maximum Receive Packet Size Register
	MRPS		0	14	Characters that end the RX packet

RPS_STAT			0x4C	Received Packet Size Register
	RPS			0	14	Characters in the last RX packet

RXFIFO_STAT			0x50	RX FIFO Status Register
	RXFFS		0	5	Filled RX FIFO stages

ERRIRQSM			0x60	Error Interrupt Mask Register
	RXFUFL		0	1	RX FIFO underflow
	RXFOFL		1	1	RX FIFO overflow

ERRIRQSS			0x64	Error Interrupt Raw Status Register
	RXFUFL		0	1	RX FIFO underflow
	RXFOFL		1	1	RX FIFO overflow

ERRIRQSC			0x68	Error Interrupt Clear Register
	RXFUFL		0	1	RX FIFO underflow
	RXFOFL		1	1	RX FIFO overflow

PIRQSM				0x70	Protocol Interrupt Mask Register
	FCI			1	1	Flow-control (CTS) input changed
	TXEND		6	1	Transmit packet completed
	RXEND		7	1	Receive packet completed

PIRQSS				0x74	Protocol Interrupt Raw Status Register
	FCI			1	1	Flow-control (CTS) input changed
	TXEND		6	1	Transmit packet completed
	RXEND		7	1	Receive packet completed

PIRQSC				0x78	Protocol Interrupt Clear Register
	FCI			1	1	Flow-control (CTS) input changed
	TXEND		6	1	Transmit packet completed
	RXEND		7	1	Receive packet completed

RIS					0x80	Raw Interrupt Status Register
	RXLSREQ		0	1	RX last single request
	RXSREQ		1	1	RX single request
	RXLBREQ		2	1	RX last burst request
	RXBREQ		3	1	RX burst request
	TXLSREQ		4	1	TX last single request
	TXSREQ		5	1	TX single request
	TXLBREQ		6	1	TX last burst request
	TXBREQ		7	1	TX burst request
	AB			8	1	Autobaud detection
	ERR			9	1	Error group (ERRIRQSS & ERRIRQSM)
	PIRQ		10	1	Protocol group (PIRQSS & PIRQSM)

IMSC				0x84	Interrupt Mask Control Register
	RXLSREQ		0	1	RX last single request
	RXSREQ		1	1	RX single request
	RXLBREQ		2	1	RX last burst request
	RXBREQ		3	1	RX burst request
	TXLSREQ		4	1	TX last single request
	TXSREQ		5	1	TX single request
	TXLBREQ		6	1	TX last burst request
	TXBREQ		7	1	TX burst request
	AB			8	1	Autobaud detection
	ERR			9	1	Error group (ERRIRQSS & ERRIRQSM)
	PIRQ		10	1	Protocol group (PIRQSS & PIRQSM)

MIS					0x88	Masked Interrupt Status Register
	RXLSREQ		0	1	RX last single request
	RXSREQ		1	1	RX single request
	RXLBREQ		2	1	RX last burst request
	RXBREQ		3	1	RX burst request
	TXLSREQ		4	1	TX last single request
	TXSREQ		5	1	TX single request
	TXLBREQ		6	1	TX last burst request
	TXBREQ		7	1	TX burst request
	AB			8	1	Autobaud detection
	ERR			9	1	Error group (ERRIRQSS & ERRIRQSM)
	PIRQ		10	1	Protocol group (PIRQSS & PIRQSM)

ICR					0x8C	Interrupt Clear Register (ERR and PIRQ clear through their groups)
	RXLSREQ		0	1	RX last single request
	RXSREQ		1	1	RX single request
	RXLBREQ		2	1	RX last burst request
	RXBREQ		3	1	RX burst request
	TXLSREQ		4	1	TX last single request
	TXSREQ		5	1	TX single request
	TXLBREQ		6	1	TX last burst request
	TXBREQ		7	1	TX burst request
	AB			8	1	Autobaud detection
	ERR			9	1	Error group (ERRIRQSS & ERRIRQSM)
	PIRQ		10	1	Protocol group (PIRQSS & PIRQSM)

ISR					0x90	Interrupt Set Register
	RXLSREQ		0	1	RX last single request
	RXSREQ		1	1	RX single request
	RXLBREQ		2	1	RX last burst request
	RXBREQ		3	1	RX burst request
	TXLSREQ		4	1	TX last single request
	TXSREQ		5	1	TX single request
	TXLBREQ		6	1	TX last burst request
	TXBREQ		7	1	TX burst request
	AB			8	1	Autobaud detection
	ERR			9	1	Error group (ERRIRQSS & ERRIRQSM)
	PIRQ		10	1	Protocol group (PIRQSS & PIRQSM)

DMAE				0x94	DMA Request Enable Register
	RXLSREQ		0	1	RX last single request
	RXSREQ		1	1	RX single request
	RXLBREQ		2	1	RX last burst request
	RXBREQ		3	1	RX burst request
	TXLSREQ		4	1	TX last single request
	TXSREQ		5	1	TX single request
	TXLBREQ		6	1	TX last burst request
	TXBREQ		7	1	TX burst request

TXD					0x4000	Transmission Data Register

RXD					0x8000	Reception Data Register
