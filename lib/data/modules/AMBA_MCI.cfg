.id 0x180
.type AMBA
.name MCI
.descr ARM PrimeCell Multimedia Card Interface (PL180)

.irq

POWER			0x000	Power control register
	CTRL			0	2	Power supply control
		POWER_OFF=0
		RESERVED=1
		POWER_UP=2
		POWER_ON=3
	VOLTAGE			2	4	Application-specific output voltage
	OPENDRAIN		6	1	MCICMD output control
	ROD				7	1	Rod control

CLOCK			0x004	Clock control register
	CLKDIV			0	8	Card bus clock divisor: MCICLK frequency = MCLK / [2 * (CLKDIV + 1)]
	ENABLE			8	1	Card bus clock enable
	PWRSAVE			9	1	Disable the card bus clock while the bus is idle
	BYPASS			10	1	Bypass the clock divider and drive MCICLK from MCLK
	WIDEBUS			11	1	Use MCIDAT[3:0] instead of MCIDAT0 only

ARGUMENT		0x008	Command argument register
	CMDARG			0	32	Command argument sent to the card

COMMAND			0x00C	Command control register
	CMDINDEX		0	6	Command index sent to the card
	RESPONSE		6	1	Wait for a response
	LONGRSP			7	1	Receive a 136-bit response
	INTERRUPT		8	1	Disable the command timer and wait for an interrupt request
	PENDING			9	1	Wait for CmdPend before sending the command
	ENABLE			10	1	Command path state machine enable

RESPCMD			0x010	Response command register
	CMDINDEX		0	6	Command index from the last received response

RESPONSE0		0x014	Card status bits [31:0] for a short response or [127:96] for a long response
	STATUS			0	32	Card status

RESPONSE1		0x018	Card status bits [95:64] for a long response
	STATUS			0	32	Card status

RESPONSE2		0x01C	Card status bits [63:32] for a long response
	STATUS			0	32	Card status

RESPONSE3		0x020	Card status bits [31:1] for a long response; bit 0 is always zero
	STATUS			0	32	Card status

DATATIMER		0x024	Data timeout register
	TIMER			0	32	Data timeout in card bus clock periods

DATALENGTH		0x028	Data length register
	LENGTH			0	16	Number of data bytes to transfer

DATACTRL		0x02C	Data path state machine control register
	ENABLE			0	1	Data transfer enable
	DIRECTION		1	1	Data transfer direction
		WRITE=0
		READ=1
	MODE			2	1	Data transfer mode
		BLOCK=0
		STREAM=1
	DMAENABLE		3	1	DMA enable
	BLOCKSIZE		4	4	Block length as a power of two in bytes; values 12-15 are reserved

DATACNT			0x030	Remaining data counter register
	COUNT			0	16	Number of data bytes remaining

STATUS			0x034	Status register
	CMDCRCFAIL		0	1	Command response received with a CRC failure
	DATACRCFAIL		1	1	Data block sent or received with a CRC failure
	CMDTIMEOUT		2	1	Command response timeout
	DATATIMEOUT		3	1	Data timeout
	TXUNDERRUN		4	1	Transmit FIFO underrun error
	RXOVERRUN		5	1	Receive FIFO overrun error
	CMDRESPEND		6	1	Command response received with a valid CRC
	CMDSENT			7	1	Command sent when no response was required
	DATAEND			8	1	Data counter reached zero
	STARTBITERR		9	1	Start bit was not detected on all data signals in wide bus mode
	DATABLOCKEND	10	1	Data block sent or received with a valid CRC
	CMDACTIVE		11	1	Command transfer is in progress
	TXACTIVE		12	1	Data transmission is in progress
	RXACTIVE		13	1	Data reception is in progress
	TXFIFOHALFEMPTY	14	1	Transmit FIFO is half empty
	RXFIFOHALFFULL	15	1	Receive FIFO is half full
	TXFIFOFULL		16	1	Transmit FIFO is full
	RXFIFOFULL		17	1	Receive FIFO is full
	TXFIFOEMPTY		18	1	Transmit FIFO is empty
	RXFIFOEMPTY		19	1	Receive FIFO is empty
	TXDATAAVLBL		20	1	Data is available in the transmit FIFO
	RXDATAAVLBL		21	1	Data is available in the receive FIFO

CLEAR			0x038	Static status flag clear register
	CMDCRCFAILCLR	0	1	Clear CMDCRCFAIL
	DATACRCFAILCLR	1	1	Clear DATACRCFAIL
	CMDTIMEOUTCLR	2	1	Clear CMDTIMEOUT
	DATATIMEOUTCLR	3	1	Clear DATATIMEOUT
	TXUNDERRUNCLR	4	1	Clear TXUNDERRUN
	RXOVERRUNCLR	5	1	Clear RXOVERRUN
	CMDRESPENDCLR	6	1	Clear CMDRESPEND
	CMDSENTCLR		7	1	Clear CMDSENT
	DATAENDCLR		8	1	Clear DATAEND
	STARTBITERRCLR	9	1	Clear STARTBITERR
	DATABLOCKENDCLR	10	1	Clear DATABLOCKEND

MASK0			0x03C	Interrupt 0 mask register
	CMDCRCFAIL		0	1	Enable CMDCRCFAIL interrupt
	DATACRCFAIL		1	1	Enable DATACRCFAIL interrupt
	CMDTIMEOUT		2	1	Enable CMDTIMEOUT interrupt
	DATATIMEOUT		3	1	Enable DATATIMEOUT interrupt
	TXUNDERRUN		4	1	Enable TXUNDERRUN interrupt
	RXOVERRUN		5	1	Enable RXOVERRUN interrupt
	CMDRESPEND		6	1	Enable CMDRESPEND interrupt
	CMDSENT			7	1	Enable CMDSENT interrupt
	DATAEND			8	1	Enable DATAEND interrupt
	STARTBITERR		9	1	Enable STARTBITERR interrupt
	DATABLOCKEND	10	1	Enable DATABLOCKEND interrupt
	CMDACTIVE		11	1	Enable CMDACTIVE interrupt
	TXACTIVE		12	1	Enable TXACTIVE interrupt
	RXACTIVE		13	1	Enable RXACTIVE interrupt
	TXFIFOHALFEMPTY	14	1	Enable TXFIFOHALFEMPTY interrupt
	RXFIFOHALFFULL	15	1	Enable RXFIFOHALFFULL interrupt
	TXFIFOFULL		16	1	Enable TXFIFOFULL interrupt
	RXFIFOFULL		17	1	Enable RXFIFOFULL interrupt
	TXFIFOEMPTY		18	1	Enable TXFIFOEMPTY interrupt
	RXFIFOEMPTY		19	1	Enable RXFIFOEMPTY interrupt
	TXDATAAVLBL		20	1	Enable TXDATAAVLBL interrupt
	RXDATAAVLBL		21	1	Enable RXDATAAVLBL interrupt

MASK1			0x040	Interrupt 1 mask register
	CMDCRCFAIL		0	1	Enable CMDCRCFAIL interrupt
	DATACRCFAIL		1	1	Enable DATACRCFAIL interrupt
	CMDTIMEOUT		2	1	Enable CMDTIMEOUT interrupt
	DATATIMEOUT		3	1	Enable DATATIMEOUT interrupt
	TXUNDERRUN		4	1	Enable TXUNDERRUN interrupt
	RXOVERRUN		5	1	Enable RXOVERRUN interrupt
	CMDRESPEND		6	1	Enable CMDRESPEND interrupt
	CMDSENT			7	1	Enable CMDSENT interrupt
	DATAEND			8	1	Enable DATAEND interrupt
	STARTBITERR		9	1	Enable STARTBITERR interrupt
	DATABLOCKEND	10	1	Enable DATABLOCKEND interrupt
	CMDACTIVE		11	1	Enable CMDACTIVE interrupt
	TXACTIVE		12	1	Enable TXACTIVE interrupt
	RXACTIVE		13	1	Enable RXACTIVE interrupt
	TXFIFOHALFEMPTY	14	1	Enable TXFIFOHALFEMPTY interrupt
	RXFIFOHALFFULL	15	1	Enable RXFIFOHALFFULL interrupt
	TXFIFOFULL		16	1	Enable TXFIFOFULL interrupt
	RXFIFOFULL		17	1	Enable RXFIFOFULL interrupt
	TXFIFOEMPTY		18	1	Enable TXFIFOEMPTY interrupt
	RXFIFOEMPTY		19	1	Enable RXFIFOEMPTY interrupt
	TXDATAAVLBL		20	1	Enable TXDATAAVLBL interrupt
	RXDATAAVLBL		21	1	Enable RXDATAAVLBL interrupt

SELECT			0x044	Secure Digital memory card select register
	SDCARD			0	4	Secure Digital memory card address

FIFOCNT			0x048	FIFO counter register
	COUNT			0	15	Number of FIFO words remaining

FIFO			0x080-0x0BC	4	Data FIFO register
	DATA			0	32	FIFO data

TCR				0x100	Test control register
	ITEN			0	1	Integration test enable
	FIFOTEST		1	2	FIFO test mode
		NORMAL=0
		DIRECT=1
		RESERVED=2
		LOOPBACK=3
	REGTEST			3	1	Bypass register hardware protection

ITIP			0x104	Integration test input register
	DMACLR			0	1	DMA clear input test value
	DATIN			1	4	Card data input values
	CMDIN			5	1	Card command input value

ITOP			0x108	Integration test output register
	INTR0			0	1	Interrupt 0 output test value
	INTR1			1	1	Interrupt 1 output test value
	DMASREQ			2	1	DMA single request output test value
	DMABREQ			3	1	DMA burst request output test value
	DMALSREQ		4	1	DMA last single request output test value
	DMALBREQ		5	1	DMA last burst request output test value
	DATOUT			6	4	Card data output test values
	CMDOUT			10	1	Card command output test value
	POWER			11	1	Card power output test value

PERIPH_ID0		0xFE0	Peripheral identification register 0
	*AMBA_PERIPH_ID0

PERIPH_ID1		0xFE4	Peripheral identification register 1
	*AMBA_PERIPH_ID1

PERIPH_ID2		0xFE8	Peripheral identification register 2
	*AMBA_PERIPH_ID2

PERIPH_ID3		0xFEC	Peripheral identification register 3
	*AMBA_PERIPH_ID3

PCELL_ID0		0xFF0	PrimeCell identification register 0

PCELL_ID1		0xFF4	PrimeCell identification register 1

PCELL_ID2		0xFF8	PrimeCell identification register 2

PCELL_ID3		0xFFC	PrimeCell identification register 3
