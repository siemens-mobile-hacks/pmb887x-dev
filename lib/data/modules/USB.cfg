.id 0xF047C000, 0xF047C012
.type MODULE
.qemu pmb887x-usb
.name USB
.size 0x900
.descr sci-worx USB device controller

.irq

EP_ENABLE_LOW		0x000				Endpoint Enable Register, endpoints 0-7
	ENDPOINTS		0	8	Bit n enables endpoint n

EP_ENABLE_HIGH		0x004				Endpoint Enable Register, endpoints 8-10
	ENDPOINTS		0	3	Bit n enables endpoint n + 8

DEVICE_ADDRESS		0x008				USB Device Address Register (bus reset clears ADDRESS)
	ADDRESS			0	7	USB device address
	ENABLE			7	1	Enable the device function

FRAME_NUMBER_HIGH	0x00C				USB Frame Number High Register
	VALUE			0	3	Frame number bits 10:8

FRAME_NUMBER_LOW	0x010				USB Frame Number Low Register
	VALUE			0	8	Frame number bits 7:0

CONTROL				0x018				USB Core Control Register
	ENABLE			0	1	Enable the core; 0 resets configuration, interrupts and timers, core registers read 0

SETUP_PACKET		0x01C-0x038	4		Setup Packet Byte Register
	DATA			0	8	SETUP packet byte

EP_CONFIG			0x03C-0x068	4		Endpoint Configuration Register; slot 0 = EP0 OUT, 1 = EP0 IN, n + 1 = EPn
	ZLP				0	1	IN: send a zero-length packet; OUT: zero-length packet received
	ISO				1	1	Isochronous endpoint (EP1-EP10); bits 5:4 read as zero while set
	CONTROL			2	1	Control endpoint (read-only)
	IN				3	1	IN endpoint (read-only)
	NAK				5	1	Slot not armed; set when a transfer completes
	STALL			6	1	Answer tokens with STALL

EP_MAX_PACKET_HIGH	0x080-0x120	0x10	Endpoint Maximum Packet Size High Register, endpoints 0-10
	VALUE			0	3	Maximum packet size bits 10:8

EP_MAX_PACKET_LOW	0x084-0x124	0x10	Endpoint Maximum Packet Size Low Register, endpoints 0-10
	VALUE			0	8	Maximum packet size bits 7:0

GLOBAL_INT_STATUS	0x180				Global Interrupt Status Register (write one to clear)
	EP0_OUT			1	1	EP0 OUT or SETUP packet received
	EP0_IN			2	1	EP0 IN packet sent
	EVENT			5	1	Enabled USB event latched
	EP_A_LOW		6	1	Enabled group A event of endpoints 0-7
	EP_A_HIGH		7	1	Enabled group A event of endpoints 8-10

GLOBAL_INT_ENABLE	0x184				Global Interrupt Enable Register (gates the IRQ line)
	EP0_OUT			1	1	EP0 OUT or SETUP packet received
	EP0_IN			2	1	EP0 IN packet sent
	EVENT			5	1	Enabled USB event latched
	EP_A_LOW		6	1	Enabled group A event of endpoints 0-7
	EP_A_HIGH		7	1	Enabled group A event of endpoints 8-10

DMA0_INT_STATUS		0x188				DMA Channel Group 0 Interrupt Status Register (write one to clear)
	SOURCES			0	8

DMA0_INT_ENABLE		0x18C				DMA Channel Group 0 Interrupt Enable Register
	SOURCES			0	8

DMA1_INT_STATUS		0x190				DMA Channel Group 1 Interrupt Status Register (write one to clear)
	SOURCES			0	2

DMA1_INT_ENABLE		0x194				DMA Channel Group 1 Interrupt Enable Register
	SOURCES			0	2

EVENT_INT_STATUS	0x198				USB Event Interrupt Status Register (write one to clear)
	WAKEUP_DONE		0	1	Remote wakeup signalling finished
	SUSPEND			1	1	Bus idle for 3 ms
	IDLE			2	1	Bus idle for 5 ms (2 ms after SUSPEND)
	RESET			3	1	Bus reset (SE0) detected
	RESUME			4	1	Resume signalling from the host
	SETUP			5	1	SETUP packet received
	EP_B_LOW		6	1	Group B event of endpoints 0-7
	EP_B_HIGH		7	1	Group B event of endpoints 8-10

EVENT_INT_ENABLE	0x19C				USB Event Interrupt Enable Register (gates GLOBAL_INT_STATUS.EVENT)
	WAKEUP_DONE		0	1	Remote wakeup signalling finished
	SUSPEND			1	1	Bus idle for 3 ms
	IDLE			2	1	Bus idle for 5 ms (2 ms after SUSPEND)
	RESET			3	1	Bus reset (SE0) detected
	RESUME			4	1	Resume signalling from the host
	SETUP			5	1	SETUP packet received
	EP_B_LOW		6	1	Group B event of endpoints 0-7
	EP_B_HIGH		7	1	Group B event of endpoints 8-10

EP_A_INT_STATUS_LOW	0x1A0				Endpoint Interrupt Group A Status Register, endpoints 0-7 (write one to clear)
	ENDPOINTS		0	8	Bit n reports endpoint n

EP_A_INT_ENABLE_LOW	0x1A4				Endpoint Interrupt Group A Enable Register, endpoints 0-7
	ENDPOINTS		0	8	Bit n enables endpoint n

EP_A_INT_STATUS_HIGH	0x1A8			Endpoint Interrupt Group A Status Register, endpoints 8-10 (write one to clear)
	ENDPOINTS		0	3	Bit n reports endpoint n + 8

EP_A_INT_ENABLE_HIGH	0x1AC			Endpoint Interrupt Group A Enable Register, endpoints 8-10
	ENDPOINTS		0	3	Bit n enables endpoint n + 8

EP_B_INT_STATUS_LOW	0x1B0				Endpoint Interrupt Group B Status Register, endpoints 0-7 (write one to clear)
	ENDPOINTS		0	8	Bit n reports endpoint n

EP_B_INT_ENABLE_LOW	0x1B4				Endpoint Interrupt Group B Enable Register, endpoints 0-7
	ENDPOINTS		0	8	Bit n enables endpoint n

EP_B_INT_STATUS_HIGH	0x1B8			Endpoint Interrupt Group B Status Register, endpoints 8-10 (write one to clear)
	ENDPOINTS		0	3	Bit n reports endpoint n + 8

EP_B_INT_ENABLE_HIGH	0x1BC			Endpoint Interrupt Group B Enable Register, endpoints 8-10
	ENDPOINTS		0	3	Bit n enables endpoint n + 8

EP_DATA				0x1C0-0x270	0x10	Endpoint FIFO Data Register, one byte per access; slot as EP_CONFIG
	DATA			0	8	FIFO byte

EP_CONTROL			0x1C4-0x274	0x10	Endpoint FIFO Control Register; slot as EP_CONFIG
	FLUSH			0	1	Discard the FIFO contents (self-clearing)
	ARM				1	1	Hand the buffer to the SIE (self-clearing)
	COMMIT			3	1	IN: end the packet before it reaches the maximum packet size
	IN_ENABLE		6	1	Enable the IN data path
	OUT_ENABLE		7	1	Enable the OUT data path

EP_COUNT_LOW		0x1C8-0x278	0x10	Endpoint FIFO Byte Count Low Register; IN: free bytes, OUT: received bytes
	VALUE			0	8	Byte count bits 7:0

EP_COUNT_HIGH		0x1CC-0x27C	0x10	Endpoint FIFO Byte Count High Register
	VALUE			0	3	Byte count bits 10:8
	ARMED			3	1	OUT FIFO armed
	LOW_LEVEL		4	1	FIFO used <= 1/4
	HIGH_LEVEL		5	1	FIFO used >= 3/4
	EMPTY			6	1	FIFO holds no data
	FULL			7	1	FIFO has no free space

PHY_CONTROL			0x2FC				USB PHY Control and Status Register
	SUSPEND			0	1	Bus idle for 3 ms (read-only)
	WAKEUP_END		1	1	Set when remote wakeup K starts (sticky)
	LINE_STATE		2	2	Received bus state (read-only)
		SE0=0
		J=1
		K=2
	RESUME			5	1	Drive remote wakeup K after 5 ms of bus idle

EP_FIFO_START		0x300-0x350	8		Endpoint FIFO Start Register, endpoints 0-10
	START			0	8	FIFO start in buffer RAM

EP_FIFO_SIZE		0x304-0x354	8		Endpoint FIFO Size Register, endpoints 0-10
	SIZE			4	3	FIFO size 16 << SIZE bytes; 0 = no FIFO

FRAME_NUMBER		0x400				USB Frame Number Register
	VALUE			0	11	Frame number

GLOBAL_EVENT_INT_STATUS	0x40C			Packed GLOBAL and EVENT Interrupt Status Register (write one to clear)
	GLOBAL			0	8	GLOBAL_INT_STATUS
	EVENT			8	8	EVENT_INT_STATUS

DMA_EP_A_INT_STATUS	0x410				Packed DMA and Endpoint Group A Interrupt Status Register
	EP_A_LOW		16	8	EP_A_INT_STATUS_LOW

GLOBAL_EVENT_EP_B_INT_ENABLE	0x414	Packed GLOBAL, EVENT and Endpoint Group B Interrupt Enable Register
	GLOBAL			0	8	GLOBAL_INT_ENABLE
	EVENT			8	8	EVENT_INT_ENABLE
	EP_B_LOW		16	8	EP_B_INT_ENABLE_LOW
	EP_B_HIGH		24	3	EP_B_INT_ENABLE_HIGH

DMA_EP_A_INT_ENABLE	0x418				Packed DMA and Endpoint Group A Interrupt Enable Register
	DMA0			0	8	DMA0_INT_ENABLE
	DMA1			8	2	DMA1_INT_ENABLE
	EP_A_LOW		16	8	EP_A_INT_ENABLE_LOW
	EP_A_HIGH		24	3	EP_A_INT_ENABLE_HIGH

EP0_COUNT			0x41C				Packed EP0 FIFO Byte Count Register
	OUT				0	16	EP_COUNT_HIGH(0) and EP_COUNT_LOW(0)
	IN				16	16	EP_COUNT_HIGH(1) and EP_COUNT_LOW(1)

EP_COUNT			0x420-0x444	4		Packed FIFO Byte Count Register, endpoints 1-10
	VALUE			0	16	EP_COUNT_HIGH and EP_COUNT_LOW of the endpoint

CLC					0x800
	*MOD_CLC

CFG					0x804				Wrapper Configuration Register
	PHY_ENABLE		0	1	Enable the transceiver; SE0 while the core is enabled signals a bus reset
	DRIVE_ENABLE	1	1	Allow the device to drive K; reads 0 and has no effect on PMB8875, which always drives K

ID					0x808
	*MOD_ID
