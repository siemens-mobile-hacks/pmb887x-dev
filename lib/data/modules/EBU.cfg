.id 0x0014C004, 0x0014C005
.type MODULE
.size 0x100000
.name EBU
.qemu pmb887x-ebu
.descr External Bus Unit (see EBU in XMC4500)

CLC					0x000
	*MOD_CLC

ID					0x008
	*MOD_ID

CON					0x010			EBU Configuration Register
	BFSSS		29	1	Burst FLASH Single Stage Synchronization
	EMUFAM		28	1	CSEMU Fills Address Map
	CS0FAM		27	1	CS0 Fills Address Map
	SDCMSEL		26	1	SDRAM Clock Mode Select
	BUSCLK		24	2	EBU clock divider from the LMB clock
		LMB=0		EBU clock equals LMB clock
		LMB_DIV2=1	EBU clock is half of LMB clock
		LMB_DIV4=2	EBU clock is one fourth of LMB clock
	GLOBALCS	16	8	Chip selects that also assert CSglb
	TOUTC		8	8	Bus time-out in units of 8 clock cycles, 0 disables it
	ARBMODE		6	2	Arbitration mode
		DISABLED=0			EBU is disabled
		EXTERNAL_MASTER=1	EBU is in external master mode
		EXTERNAL_SLAVE=2	EBU is in external slave mode
		SOLE_MASTER=3		No arbitration, EBU is the only bus master
	ARBSYNC		5	1	Arbitration inputs are asynchronous
	EXTLOCK		4	1	Lock the external bus after gaining ownership
	EXTACC		3	1	External device access to the FPI bus
	EXTSVM		2	1	External accesses to the FPI bus in supervisor mode
	EXTRECON	1	1	External master can reconfigure EXTCON

BFCON				0x020			EBU Burst Flash Control Register
	DBA1		26	1	Disable Burst Address Wrapping for Burst FLASH Type 1
	EBSE1		25	1	Early Burst Signal Enable for Burst FLASH Type 1
	WAITFUNC1	21	1	Function of WAIT Input for Burst FLASH Type 1
	FBBMSEL1	20	1	FLASH Burst Buffer Mode Select for Burst FLASH Type 1
	FETBLEN1	16	4	Fetch Burst Length for Burst FLASH Type 1
		1=0	One data access
		2=1	Two data accesses
		4=2	Four data accesses
		8=3	Eight data accesses
	DTALTNCY	12	4	Read latency with clock feedback, 2 * (EXTCLOCK + 1)
	FDBKEN		11	1	Burst FLASH Clock Feedback Enable
	DBA0		10	1	Disable Burst Address Wrapping
	EBSE0		9	1	Early Burst Signal Enable for Burst FLASH Type 0
	BFCMSEL		8	1	Burst FLASH Clock Mode Select
	EXTCLOCK	6	2	Frequency of external clock
		LMB=0		Equal to LMB clock
		LMB_DIV2=1	Half of LMB clock
		LMB_DIV3=2	One third of LMB clock
		LMB_DIV4=3	One fourth of LMB clock
	WAITFUNC0	5	1	Function of WAIT Input for Burst FLASH Type 0
	FBBMSEL0	4	1	FLASH Burst Buffer Mode Select for Burst FLASH Type 0
	FETBLEN0	0	4	Fetch Burst Length for Burst FLASH Type 0
		1=0	One data access
		2=1	Two data accesses
		4=2	Four data accesses
		8=3	Eight data accesses

ADDRSEL				0x080-0x0B0	8	EBU Address Select Register
	BASE		12	20	Memory region base address
	ALTSEG		8	4	Alternate segment compared with address bits 31-28
	MASK		4	4	Number of base address bits from bit 26 included in the comparison
	ALTENAB		1	1	Compare the alternate segment
	REGENAB		0	1	Memory region enable

BUSCON				0x0C0-0xF0	8	EBU Bus Configuration Register
	WRITE		31	1	Memory region write protection
	AGEN		28	3	Address generation
		ASYNC_DEMULTIPLEXED=0
		ASYNC_MULTIPLEXED=1
		BURST_FLASH_0=2
		SDRAM_0=3
		SDRAM_1=4
		BURST_FLASH_1=5
	XCMDDELAY	26	2	External command delay input
		OFF=0	Command delay input ignored
		ASYNC=1	Asynchronous input at CMDDELAY
		SYNC=2	Synchronous input at CMDDELAY
	WAIT		24	2	External wait state input
		OFF=0	WAIT input ignored
		ASYNC=1	Asynchronous input at WAIT
		SYNC=2	Synchronous input at WAIT
	PORTW		22	2	Port width
		16BIT=1	16-bit port
		32BIT=2	32-bit port
	BCGEN		20	2	Byte control signal timing
		CS=0			Follow chip select
		CONTROL=1		Follow RD and RD/WR
		WRITE_ENABLE=2	Follow RD/WR only
		DQM=3			DQM for SDRAM accesses
	WAITINV		19	1	WAIT input is active high
	PRE			18	1	Code accesses use the prefetch buffer
	DLOAD		17	1	Data accesses always come from the external bus, not the write buffer
	ENDIAN		16	1	Big endian access mode
	CMULT		13	3	Multiplier for the delay cycles selected by MULTMAP
		1=0		Multiplier is 1
		4=1		Multiplier is 4
		8=2		Multiplier is 8
		16=3	Multiplier is 16
		32=4	Multiplier is 32
	CTYPE		10	2	Address and data bus multiplexing for burst flash
		NON_MULTIPLEXED=0			Separate address bus
		MULTIPLEXED=1				Address on the data bus during the address phases
		TWIN_16BIT_MULTIPLEXED=2	Same 16-bit address on both data bus halves, 32-bit port only
	AALIGN		9	1	Align the address to the port width
	WPRE		8	1	A data access can abort a running prefetch
	UNK7		7	1	Undocumented writable field
	MULTMAP		0	7	Delay cycle fields that use the CMULT multiplier

BUSAP				0x100-0x130	8	EBU Bus Access Parameter Register
	ADDRC		30	2	Address phase cycles
	AHOLDC		28	2	Address hold cycles for multiplexed accesses
	CMDDELAY	25	3	Command delay cycles
	WAITRDC		22	3	Wait states for read accesses
	WAITWRC		19	3	Wait states for write accesses
	BURSTC		16	3	Data cycles during burst accesses
	DATAC		14	2	Data hold cycles for write accesses
	RDRECOVC	11	3	Recovery cycles after read accesses
	WRRECOVC	8	3	Recovery cycles after write accesses
	DTARDWR		4	4	Recovery cycles between read and write accesses
	DTACS		0	4	Recovery cycles between accesses to different regions

SDRMREF				0x040-0x048	8	EBU SDRAM Refresh Register
	AUTOSELFR	13	1	Self refresh while the EBU gives up the external bus
	SELFREN		12	1	Issue the self refresh entry command
	SELFRENST	11	1	Self refresh entry command was issued
	SELFREX		10	1	Issue the self refresh exit command
	SELFREXST	9	1	Self refresh exit command was issued
	REFRESHR	6	3	Additional refresh commands per refresh
	REFRESHC	0	6	Refresh period in units of 64 clock cycles, 0 disables refresh

SDRMCON				0x050-0x058	8	EBU SDRAM Control Register
	CRCE		25	1	Row cycle time counter extension
	BANKM		22	3	Mask for bank tag
		ALWAYS_MISS=0	Always generates a bank miss
		BITS_26_20=1	Compare address bits 26 to 20
		BITS_26_21=2	Compare address bits 26 to 21
		BITS_26_22=3	Compare address bits 26 to 22
		BITS_26_23=4	Compare address bits 26 to 23
		BITS_26_24=5	Compare address bits 26 to 24
		BITS_26_25=6	Compare address bits 26 to 25
		BIT_26=7		Compare address bit 26
	PAGEM		19	3	Mask for page tag
		ALWAYS_MISS=0	Always generates a page miss
		BITS_26_9=1		Compare address bits 26 to 9
		BITS_26_10=2	Compare address bits 26 to 10
		BITS_26_11=3	Compare address bits 26 to 11
		BITS_26_12=4	Compare address bits 26 to 12
		BITS_26_13=5	Compare address bits 26 to 13
	CRC			16	3	NOP cycles between refresh commands during power-up initialization
	CRCD		14	2	NOP cycles between row and column address
	AWIDTH		12	2	Column address width, depends on the port width
	CRP			10	2	NOP cycles after a precharge command
	CRSC		8	2	NOP cycles after a mode register set command
	CRFSH		4	4	Refresh commands during power-up initialization
	CRAS		0	4	Clock cycles from row activate to precharge

SDRMOD				0x060-0x068	8	EBU SDRAM Mode Register
	OPMODE		7	7	Operation mode
	CASLAT		4	3	Clocks from a READ command to valid data
		1=1	One clock, for test only
		2=2	Two clocks
		3=3	Three clocks
	BTYP		3	1	Burst type
	BURSTL		0	3	Locations accessed by a single command
		1=0	One location per command
		8=3	Eight locations per command

SDRSTAT				0x070-0x078	8	EBU SDRAM Status Register
	UNK8		8	1	Undocumented status bit, reads as one
	SDRM_BUSY	1	1	Power-up initialization sequence is running
	REFERR		0	1	Refresh request collided with a pending refresh

EMUAS				0x160			EBU Emulator Address Select Register
	BASE		12	20	Memory region base address
	ALTSEG		8	4	Alternate segment compared with address bits 31-28
	MASK		4	4	Number of base address bits from bit 26 included in the comparison
	ALTENAB		1	1	Compare the alternate segment
	REGENAB		0	1	Memory region enable

EMUBC				0x168			EBU Emulator Bus Configuration Register
	WRITE		31	1	Memory region write protection
	AGEN		28	3	Address generation
		ASYNC_DEMULTIPLEXED=0
		ASYNC_MULTIPLEXED=1
		BURST_FLASH_0=2
		SDRAM_0=3
		SDRAM_1=4
		BURST_FLASH_1=5
	XCMDDELAY	26	2	External command delay input
		OFF=0	Command delay input ignored
		ASYNC=1	Asynchronous input at CMDDELAY
		SYNC=2	Synchronous input at CMDDELAY
	WAIT		24	2	External wait state input
		OFF=0	WAIT input ignored
		ASYNC=1	Asynchronous input at WAIT
		SYNC=2	Synchronous input at WAIT
	PORTW		22	2	Port width
		16BIT=1	16-bit port
		32BIT=2	32-bit port
	BCGEN		20	2	Byte control signal timing
		CS=0			Follow chip select
		CONTROL=1		Follow RD and RD/WR
		WRITE_ENABLE=2	Follow RD/WR only
		DQM=3			DQM for SDRAM accesses
	WAITINV		19	1	WAIT input is active high
	PRE			18	1	Code accesses use the prefetch buffer
	DLOAD		17	1	Data accesses always come from the external bus, not the write buffer
	ENDIAN		16	1	Big endian access mode
	CMULT		13	3	Multiplier for the delay cycles selected by MULTMAP
		1=0		Multiplier is 1
		4=1		Multiplier is 4
		8=2		Multiplier is 8
		16=3	Multiplier is 16
		32=4	Multiplier is 32
	CTYPE		10	2	Address and data bus multiplexing for burst flash
		NON_MULTIPLEXED=0			Separate address bus
		MULTIPLEXED=1				Address on the data bus during the address phases
		TWIN_16BIT_MULTIPLEXED=2	Same 16-bit address on both data bus halves, 32-bit port only
	AALIGN		9	1	Align the address to the port width
	WPRE		8	1	A data access can abort a running prefetch
	UNK7		7	1	Undocumented writable field
	MULTMAP		0	7	Delay cycle fields that use the CMULT multiplier

EMUBAP				0x170			EBU Emulator Bus Access Parameter Register
	ADDRC		30	2	Address phase cycles
	AHOLDC		28	2	Address hold cycles for multiplexed accesses
	CMDDELAY	25	3	Command delay cycles
	WAITRDC		22	3	Wait states for read accesses
	WAITWRC		19	3	Wait states for write accesses
	BURSTC		16	3	Data cycles during burst accesses
	DATAC		14	2	Data hold cycles for write accesses
	RDRECOVC	11	3	Recovery cycles after read accesses
	WRRECOVC	8	3	Recovery cycles after write accesses
	DTARDWR		4	4	Recovery cycles between read and write accesses
	DTACS		0	4	Recovery cycles between accesses to different regions

EMUOVL				0x178			EBU Emulator Overlay Register
	OVERLAY		0	8	Chip selects that also assert CSovl

USERCON				0x190			EBU Test/Control Configuration Register
