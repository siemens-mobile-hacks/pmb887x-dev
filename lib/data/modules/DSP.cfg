.id 0xF022C010, 0xF022C031
.type MODULE
.size 0x2000
.name DSP
.qemu pmb887x-dsp
.descr Digital Signal Processor

.gpio DSPOUT0
.gpio DSPOUT1
.gpio DSPIN0
.gpio DSPIN1

.region RAM 0x1000 0x2000 4

CLC		0x000
	*MOD_CLC

ID		0x008
	*MOD_ID

SEM_SET		0x10	MCU Semaphore Set Register (write one to request, reads as zero)
	FLAGS		0	16	Semaphores requested by the MCU

SEM_CLEAR	0x14	MCU Semaphore Reset Register (write one to release, reads as zero)
	FLAGS		0	16	Semaphores released by the MCU

SEM_STATUS	0x18	MCU Semaphore Status Register (read-only)
	FLAGS		0	16	Zero for semaphores owned by the MCU, one for semaphores owned by the DSP or free

COM_SET		0x1C	MCU Communication Flag Set Register (write one to set, reads as zero)
	FLAGS		0	16	Communication flags to set; flag 0 handshakes boot commands on DSP interrupt 0

COM_CLEAR	0x20	MCU Communication Flag Reset Register (write one to clear, reads as zero)
	FLAGS		0	16	Communication flags to reset; DSP clears flag 0 after accepting a boot command

COM_STATUS	0x24	MCU Communication Flag Status Register (read-only)
	FLAGS		0	16	Shared MCU/DSP communication flag status
